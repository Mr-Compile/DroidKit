name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  release-build:
    runs-on: ubuntu-latest
    env:
      # Base64-encoded upload keystore — a repo SECRET, never a var or a file.
      KEYSTORE_B64: ${{ secrets.DROIDKIT_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore (optional)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/droidkit-upload.jks"
          echo "DROIDKIT_KEYSTORE=$RUNNER_TEMP/droidkit-upload.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          DROIDKIT_KEYSTORE_PASSWORD: ${{ secrets.DROIDKIT_KEYSTORE_PASSWORD }}
          DROIDKIT_KEY_ALIAS: ${{ secrets.DROIDKIT_KEY_ALIAS }}
          DROIDKIT_KEY_PASSWORD: ${{ secrets.DROIDKIT_KEY_PASSWORD }}

      - name: Verify signature (when keystore provided)
        if: env.KEYSTORE_B64 != ''
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: droidkit-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
