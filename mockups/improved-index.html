<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DroidKit — improved UI mockup (Dark Instrument)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background:
      radial-gradient(1100px 560px at 80% -12%, rgba(60,232,138,.07), transparent 60%),
      radial-gradient(900px 520px at -8% 112%, rgba(20,184,204,.05), transparent 60%),
      #050A0A;
    color: #dde2ea;
    display: flex; flex-direction: column;
  }
  header.page {
    padding: 14px 22px; border-bottom: 1px solid rgba(60,232,138,.15);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    background: #060B0B;
  }
  header.page h1 { font-size: 18px; font-weight: 650; letter-spacing: -.2px; color: #EAF2F0; }
  header.page .hint { font-size: 13px; color: #6E8385; }
  .layout { flex: 1; display: flex; min-height: 0; }
  .phone-col {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start; padding: 18px; gap: 10px; min-width: 430px;
  }
  .sizebar { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .sizebar button {
    background: #0B1517; color: #8FA5A7; border: 1px solid rgba(255,255,255,.08);
    border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  .sizebar button.sel { border-color: rgba(60,232,138,.55); color: #3CE88A; background: rgba(60,232,138,.07); }
  .route-bar {
    font: 12px/1.4 Consolas, monospace; color: #14B8CC;
    background: #0B1517; border: 1px solid rgba(255,255,255,.08); border-radius: 8px;
    padding: 5px 12px; max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* ---------- phone frame ---------- */
  .phone {
    width: 392px; height: min(800px, calc(100vh - 185px)); min-height: 470px;
    border-radius: 36px;
    border: 10px solid #0A1010; outline: 1px solid rgba(60,232,138,.22);
    background: #000; position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 24px 60px rgba(0,0,0,.6), 0 0 90px rgba(60,232,138,.05);
  }
  /* window size classes (mirrors the app's navChromeFor rule) */
  .phone[data-size="medium"]   { width: min(620px, 94vw); }
  .phone[data-size="expanded"] { width: min(860px, 94vw); }
  .phonemain { flex: 1; display: flex; min-height: 0; }
  .contentcol { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .navrail {
    display: none; flex: none; width: 76px; flex-direction: column;
    align-items: center; gap: 4px; padding: 12px 6px;
    background: var(--panel); border-right: 1px solid var(--line-n);
  }
  .rnav {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px;
    width: 100%; padding: 9px 2px; border-radius: 10px; cursor: pointer;
    color: var(--sub); font-size: 10px; font-weight: 600; letter-spacing: .4px;
    transition: color .15s, background .15s;
  }
  .rnav:hover { background: rgba(60,232,138,.06); }
  .rnav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .rnav .pill { display: flex; }
  .rnav.sel { color: var(--brand); }
  .rnav.sel::before {
    content: ""; position: absolute; left: -6px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 24px; border-radius: 0 3px 3px 0;
    background: var(--grad); box-shadow: 2px 0 12px var(--glow);
  }
  .phone[data-size="medium"] .navrail,
  .phone[data-size="expanded"] .navrail { display: flex; }
  .phone[data-size="medium"] .bottomnav,
  .phone[data-size="expanded"] .bottomnav { display: none; }
  /* two-pane list-detail at expanded (apps / usb / reports) */
  .panes { display: flex; height: 100%; min-height: 0; }
  .pane-list { flex: 0 0 42%; min-width: 0; overflow-y: auto; border-right: 1px solid var(--line-n); }
  .pane-detail { flex: 1; min-width: 0; overflow-y: auto; display: flex; flex-direction: column; }
  .pane-empty { flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--sub); font-size: 13px; text-align: center; padding: 20px; }
  .panehdr { flex: none; min-height: 46px; display: flex; align-items: center; gap: 4px; padding: 0 12px; font-size: 16px; border-bottom: 1px solid var(--line-n); }
  /* readable content cap at expanded (mirrors Modifier.contentWidthCap) */
  .phone[data-size="expanded"] #body .pad { max-width: 640px; width: 100%; margin: 0 auto; }
  .phone[data-theme="dark"] {
    /* Dark Instrument — splash-derived brand tokens */
    --ink: #040808; --panel: #0B1517; --panel2: #0F1D20; --raise: #15262B;
    --line: rgba(60,232,138,.16); --line-n: rgba(255,255,255,.08);
    --brand: #3CE88A; --brand2: #14B8CC; --glow: rgba(60,232,138,.28);
    --grad: linear-gradient(135deg,#3CE88A 0%,#14B8CC 100%);
    --onbrand: #04150D;
    --ok: #3CE88A; --warn: #F6C453; --info: #14B8CC; --unsup: #8B95A3; --setup: #B08CFF;
    --faint: #6E8385; --err: #FF7A6E;
    /* aliases consumed by shared classes and inline styles */
    --surface: var(--ink); --card: var(--panel); --card2: var(--panel2);
    --text: #EAF2F0; --sub: #8FA5A7; --outline: rgba(255,255,255,.16);
    --primary: var(--brand); --on-primary: var(--onbrand); --error: var(--err);
    --tonal: var(--raise); --field: #0A1417; --kit: var(--brand); --gradb: var(--brand2);
  }
  .phone[data-theme="light"] {
    --ink: #EFF5F3; --panel: #FFFFFF; --panel2: #E9F1EE; --raise: #DFEAE6;
    --line: rgba(14,158,107,.24); --line-n: rgba(12,20,22,.10);
    --brand: #0E9E6B; --brand2: #0E8FA3; --glow: rgba(14,158,107,.18);
    --grad: linear-gradient(135deg,#0E9E6B 0%,#0E8FA3 100%);
    --onbrand: #FFFFFF;
    --ok: #0E9E6B; --warn: #9A6B06; --info: #0E8FA3; --unsup: #6B7680; --setup: #7A5FD0;
    --faint: #7A8B8D; --err: #C93C2F;
    --surface: var(--ink); --card: var(--panel); --card2: var(--panel2);
    --text: #0C1416; --sub: #54666A; --outline: rgba(12,20,22,.18);
    --primary: var(--brand); --on-primary: var(--onbrand); --error: var(--err);
    --tonal: var(--raise); --field: #E7F0ED; --kit: var(--brand); --gradb: var(--brand2);
  }
  .statusbar {
    height: 26px; flex: none; display: flex; align-items: center;
    justify-content: space-between; padding: 0 18px;
    font-size: 12px; font-weight: 600; color: var(--text);
    background: var(--ink); z-index: 5;
  }
  .statusbar .sicons { display: flex; gap: 5px; align-items: center; }
  /* ---------- Dark Instrument widgets ---------- */
  #appbar {
    flex: none; min-height: 58px; display: flex; align-items: center;
    padding: 0 16px; background: var(--ink); color: var(--text);
    font-size: 19px; position: relative; border-bottom: 1px solid var(--line-n);
  }
  #appbar .title { font-weight: 650; letter-spacing: -.2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #appbar .actions { margin-left: auto; display: flex; align-items: center; }
  .iconbtn { cursor: pointer; padding: 6px; border-radius: 9px; color: var(--sub); }
  .iconbtn:hover { background: rgba(60,232,138,.09); color: var(--brand); }
  .tic { flex:none; width:40px; height:40px; border-radius:11px;
    background: linear-gradient(135deg, rgba(60,232,138,.13), rgba(20,184,204,.05));
    border: 1px solid var(--line); color: var(--brand);
    display:flex; align-items:center; justify-content:center; }
  .tic svg { width:22px; height:22px; fill:currentColor; }
  #appbar .textbtn { margin-left: 4px; }
  .progress-line { height: 3px; background: var(--raise); flex: none; }
  .progress-line > div { height: 100%; background: var(--grad); transition: width .3s; box-shadow: 0 0 8px var(--glow); }
  #body { flex: 1; overflow-y: auto; background: var(--ink); color: var(--text); position: relative; }
  #body::-webkit-scrollbar { width: 4px; }
  #body::-webkit-scrollbar-thumb { background: var(--raise); border-radius: 2px; }
  .pad { padding: 8px 16px 16px; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .card {
    background: var(--panel); border: 1px solid var(--line-n);
    border-radius: 12px; padding: 16px;
    color: var(--text);
  }
  .card.clickable { cursor: pointer; transition: transform .12s ease, background .15s, border-color .15s; }
  .card.clickable:hover { background: var(--panel2); border-color: var(--line); }
  .card.clickable:active { transform: scale(.985); transition: none; }
  .t-small { font-size: 14px; font-weight: 650; letter-spacing: -.1px; }
  .t-med { font-size: 15px; }
  .t-body { font-size: 13.5px; line-height: 1.45; }
  .t-mini { font-size: 12px; }
  .sub { color: var(--sub); }
  .err { color: var(--err); }
  .pri { color: var(--brand); }
  .sec-head {
    display: flex; align-items: center; gap: 9px;
    font-size: 10.5px; font-weight: 700; color: var(--faint);
    padding: 12px 2px 6px; letter-spacing: 2.2px; text-transform: uppercase;
  }
  .sec-head::before {
    content: ""; flex: none; width: 11px; height: 2px; border-radius: 1px;
    background: var(--grad);
  }
  .row { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1; min-width: 0; }
  .inforow { display: flex; align-items: center; padding: 4px 0; gap: 8px; }
  .inforow .k { flex: 1; min-width: 0; overflow-wrap: break-word; font-size: 13px; color: var(--sub); }
  .inforow .v { flex: 1.2; min-width: 0; font-family: Consolas, monospace; font-size: 12.5px; color: var(--text); text-align: right; word-break: break-all; }
  .inforow .v.na { color: var(--faint); font-style: italic; }
  .copybtn { font-size: 11px; font-weight: 600; color: var(--brand); cursor: pointer; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line-n); }
  .copybtn:hover { border-color: var(--line); background: rgba(60,232,138,.07); }
  .btn {
    display: inline-block; border: none; border-radius: 10px; cursor: pointer;
    background: var(--grad); color: var(--onbrand);
    font-size: 14px; font-weight: 700; letter-spacing: .3px;
    padding: 11px 18px; text-align: center;
    box-shadow: 0 4px 18px rgba(60,232,138,.20), inset 0 1px 0 rgba(255,255,255,.22);
  }
  .btn:hover { filter: brightness(1.07); }
  .btn.full { display: block; width: 100%; }
  .btn:disabled { background: var(--raise); color: var(--sub); box-shadow: none; opacity: .55; cursor: default; }
  .btn-outline {
    background: transparent; color: var(--brand);
    border: 1px solid var(--line); border-radius: 10px;
    font-size: 14px; font-weight: 600; padding: 10px 16px; cursor: pointer; text-align: center;
    transition: background .15s, border-color .15s;
  }
  .btn-outline:hover { background: rgba(60,232,138,.07); border-color: rgba(60,232,138,.45); }
  .btn-outline:disabled { opacity: .38; cursor: default; }
  .textbtn {
    background: none; border: none; color: var(--brand); font-size: 13.5px;
    font-weight: 600; cursor: pointer; padding: 8px 10px; border-radius: 8px;
  }
  .textbtn:hover { background: rgba(60,232,138,.08); }
  .chip {
    display: inline-block; border: 1px solid var(--line-n); border-radius: 7px;
    background: var(--panel);
    font-size: 11px; font-weight: 600; letter-spacing: .4px; padding: 5px 10px; color: var(--sub); margin: 2px 4px 0 0;
  }
  .fchip {
    border: 1px solid var(--line-n); background: transparent; color: var(--sub);
    border-radius: 9px; font-size: 13px; padding: 8px 14px; cursor: pointer; flex: none;
    transition: border-color .15s, color .15s, background .15s;
  }
  .fchip:hover { border-color: var(--line); color: var(--text); }
  .fchip.sel { border-color: rgba(60,232,138,.55); color: var(--brand); font-weight: 650; background: rgba(60,232,138,.07); }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line-n); border-radius: 7px; font-size: 11px;
    font-weight: 600; letter-spacing: .4px; padding: 4px 9px; flex: none; color: var(--sub);
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.ok { color: var(--ok); border-color: var(--line); background: rgba(60,232,138,.06); }
  .badge.ready { color: var(--ok); border-color: var(--line); background: rgba(60,232,138,.06); }
  .badge.setup { color: var(--setup); border-color: color-mix(in srgb, var(--setup) 40%, transparent); background: color-mix(in srgb, var(--setup) 8%, transparent); }
  .badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 8%, transparent); }
  .badge.dim { color: var(--unsup); }
  .badge.blocked { color: var(--err); border-color: color-mix(in srgb, var(--err) 35%, transparent); background: color-mix(in srgb, var(--err) 7%, transparent); }
  /* AI rich text — mirrors AiRichText.kt: verdict pills + per-line status icons */
  .ai-line { display: flex; align-items: flex-start; gap: 6px; margin: 3px 0; }
  .ai-ico { width: 20px; flex: none; margin-top: 1px; display: flex; justify-content: center; }
  .ai-ico svg { width: 15px; height: 15px; fill: currentColor; }
  .ai-ico.ok { color: var(--kit); }
  .ai-ico.warn { color: var(--warn); }
  .ai-ico.bad { color: var(--error); }
  .ai-ico.inf { color: var(--info); }
  .ai-dot { width: 20px; flex: none; text-align: center; color: var(--sub); }
  .ai-num { width: 20px; flex: none; color: var(--sub); }
  .ai-h { font-weight: 700; margin: 8px 0 2px; }
  .ai-hr { height: 1px; background: var(--outline); opacity: .45; margin: 8px 0; }
  .ai-verdict { display: inline-block; border-radius: 8px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; flex: none; margin-top: 1px; }
  .ai-verdict.ok { color: var(--kit); border: 1px solid color-mix(in srgb, var(--kit) 40%, transparent); background: color-mix(in srgb, var(--kit) 12%, transparent); }
  .ai-verdict.warn { color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 8%, transparent); }
  .ai-verdict.bad { color: var(--error); border: 1px solid color-mix(in srgb, var(--error) 45%, transparent); background: color-mix(in srgb, var(--error) 12%, transparent); }
  .ai-line code { font-family: Consolas, monospace; font-size: 12px; background: var(--card2); border-radius: 4px; padding: 0 4px; }
  .field {
    width: 100%; background: var(--field); border: 1px solid var(--line-n);
    border-radius: 10px;
    color: var(--text); font-size: 14px; padding: 11px 13px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .field:focus { border-color: rgba(60,232,138,.55); box-shadow: 0 0 0 3px rgba(60,232,138,.10); }
  .field::placeholder { color: var(--faint); }
  .flabel { font-size: 10px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--faint); display: block; padding: 0 0 4px 2px; }
  .empty { padding: 28px 16px; color: var(--sub); font-size: 13.5px; border: 1px dashed var(--line-n); border-radius: 12px; text-align: center; }
  .chiprow { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; }
  .chiprow::-webkit-scrollbar { display: none; }
  .star { cursor: pointer; font-size: 18px; color: var(--raise); flex: none; padding: 4px; }
  .star.on { color: var(--warn); }
  /* ---------- bottom nav + gesture bar ---------- */
  .bottomnav {
    flex: none; height: 66px; background: var(--panel); display: flex;
    border-top: 1px solid var(--line-n);
  }
  .bnav { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; color: var(--sub); font-size: 10.5px; font-weight: 600; letter-spacing: .5px; position: relative; padding-top: 5px; transition: color .15s; }
  .bnav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .bnav .pill { display: flex; }
  .bnav.sel { color: var(--brand); }
  .bnav.sel::before {
    content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 24px; height: 3px; border-radius: 0 0 3px 3px;
    background: var(--grad); box-shadow: 0 2px 12px var(--glow);
  }
  .gesturebar {
    flex: none; height: 26px; background: var(--panel); display: flex;
    align-items: center; justify-content: space-around; padding: 0 70px;
    color: var(--sub);
  }
  .gesturebar .g { cursor: pointer; opacity: .55; }
  .gesturebar .g:hover { opacity: 1; color: var(--brand); }
  /* ---------- test result bar ---------- */
  .testbar { flex: none; background: var(--panel); border-top: 1px solid var(--line-n); padding: 8px 16px 10px; }
  .testbar .rrow { display: flex; gap: 8px; align-items: center; }
  .testbar .rrow .spacer { flex: 0 0 auto; }
  /* ---------- overlays ---------- */
  #overlay { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
  .scrim { position: absolute; inset: 0; background: rgba(2,6,6,.62); backdrop-filter: blur(2px); pointer-events: auto; }
  .dialog {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%);
    width: 82%; background: var(--raise); border: 1px solid var(--line-n);
    border-radius: 16px; padding: 22px;
    pointer-events: auto; box-shadow: 0 12px 44px rgba(0,0,0,.6), 0 0 0 1px rgba(60,232,138,.05); color: var(--text);
  }
  .dialog h3 { font-size: 17px; margin-bottom: 10px; font-weight: 650; letter-spacing: -.2px; }
  .dialog .dtext { font-size: 13.5px; line-height: 1.5; color: var(--text); }
  .dialog .dbtns { display: flex; justify-content: flex-end; gap: 4px; margin-top: 18px; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; background: var(--raise);
    border-top: 1px solid var(--line); border-radius: 18px 18px 0 0;
    padding: 20px 20px 28px; pointer-events: auto;
    color: var(--text); box-shadow: 0 -8px 32px rgba(0,0,0,.5);
    animation: rise .25s ease-out;
  }
  @keyframes rise { from { transform: translateY(40px); opacity: .4; } }
  .toast {
    position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: var(--raise); border: 1px solid var(--line-n); color: var(--text);
    font-size: 12.5px; padding: 9px 16px;
    border-radius: 10px; pointer-events: none; white-space: nowrap;
    animation: fade .25s; z-index: 40; box-shadow: 0 6px 24px rgba(0,0,0,.5);
  }
  @keyframes fade { from { opacity: 0; transform: translateX(-50%) translateY(8px); } }
  /* ---------- splash ---------- */
  @keyframes dkhalo { from { opacity: .55; } to { opacity: 1; } }
  @keyframes dkspin { to { transform: rotate(360deg); } }
  .menu {
    position: absolute; top: 30px; right: 14px; background: var(--raise);
    border: 1px solid var(--line-n);
    border-radius: 12px; padding: 6px 0; min-width: 180px; pointer-events: auto;
    box-shadow: 0 8px 28px rgba(0,0,0,.55); color: var(--text);
  }
  .menu .mi { padding: 11px 16px; font-size: 13.5px; cursor: pointer; }
  .menu .mi:hover { background: rgba(60,232,138,.07); color: var(--brand); }
  /* ---------- test screens ---------- */
  .colorbox { position: absolute; inset: 0; cursor: pointer; }
  .colorcard {
    position: absolute; top: 14px; left: 14px; right: 14px;
    background: var(--panel); border: 1px solid var(--line-n); border-radius: 12px; padding: 16px;
    box-shadow: 0 4px 18px rgba(0,0,0,.35);
  }
  .gridcanvas { position: absolute; inset: 0 0 0 0; touch-action: none; cursor: crosshair; }
  .tg-cell { position: absolute; }
  .mt-dot { position: absolute; border-radius: 50%; opacity: .8; pointer-events: none; transform: translate(-50%,-50%); }
  .camview {
    border-radius: 12px; flex: 1; margin: 0 16px; min-height: 280px;
    background: linear-gradient(135deg,#3a4a5a,#1c2733 40%,#2e3d2a 75%,#141b24);
    background-size: 300% 300%; animation: cam 9s ease-in-out infinite;
    display: flex; align-items: flex-end; padding: 12px; color: #cfd8e3; font-size: 12px;
  }
  @keyframes cam { 0%,100% { background-position: 0% 40%; } 50% { background-position: 100% 60%; } }
  .torch-on { box-shadow: 0 0 90px 30px rgba(255,240,140,.55) inset; }
  .sensorbar { height: 4px; background: var(--raise); border-radius: 2px; margin: 2px 0 6px; overflow: hidden; }
  .sensorbar > div { height: 100%; background: var(--grad); }
  /* ---------- insights ---------- */
  .statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--raise); border: 1px solid var(--line-n); border-radius: 10px; padding: 10px 12px; }
  .stat .n { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 10px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--faint); margin-top: 2px; }
  .donutwrap { position: relative; width: 104px; flex: none; }
  .donutwrap .dlabel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .hbar { height: 4px; background: var(--raise); border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .hbar > div { height: 100%; background: var(--err); }
  /* ---------- flow map ---------- */
  .flowmap {
    width: 330px; flex: none; border-left: 1px solid rgba(60,232,138,.12);
    background: #060B0B;
    overflow-y: auto; padding: 14px 14px 30px;
  }

/* Same matching as ToolRegistry: lowercase alphanumerics only. */
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g,"");
function scoreFields(title, kws, desc, nq){
  const nt = norm(title), nk = kws.map(norm);
  return nt===nq ? 100 : nt.startsWith(nq) ? 80 : nt.includes(nq) ? 60
    : nk.some(k=>k===nq) ? 50 : nk.some(k=>k.startsWith(nq)) ? 40 : nk.some(k=>k.includes(nq)) ? 30
    : norm(desc||"").includes(nq) ? 20 : null;
}
function searchEntries(nq){
  const entries = PAGES.concat(TESTS.map(t=>({
    id:"diag."+t.id, title:t.title, subtitle:t.cat+" test",
    route:"diagnose/test/"+t.id, group:"Diagnostics",
    icon:TEST_ICON[t.id]||"monitor_heart", kw:TEST_KW[t.id]||[],
  })));
  return entries.map(e=>({e,s:scoreFields(e.title,e.kw,e.subtitle,nq)}))
    .filter(x=>x.s!=null)
    .sort((a,b)=>b.s-a.s || a.e.title.localeCompare(b.e.title))
    .map(x=>x.e);
}
/* Reason-aware badge label, same dominant-reason order as the app:
   provider > permission > device. */
function badgeLabel(r){
  const b = r.blocked||[];
  const prov = b.find(s=>s.includes("provider"));
  if(prov) return (prov.includes("unavailable")||prov.includes("No provider")) ? "Unavailable" : "Setup required";
  if(b.some(s=>s.startsWith("Permission required"))) return "Permission required";
  if(b.some(s=>s.startsWith("Hardware missing"))) return "Not supported";
  const api = b.find(s=>s.startsWith("Requires Android API"));
  if(api) return api.replace("Requires Android API","Needs API");
  return "Unavailable";
}
/* badge tone from the dominant blocked reason — setup/permission are
   actionable (amber/purple), unavailable/unsupported stay neutral. */
function badgeCls(r){
  if(r.ready) return "ok";
  const lbl = badgeLabel(r);
  if(lbl==="Setup required") return "setup";
  if(lbl==="Permission required") return "warn";
  return "dim";
}
const CAP2KIND = { STANDARD_API:"STANDARD", RUNTIME_PERMISSION:"STANDARD", ADB_SHELL:"ADB", ROOT:"ROOT" };
const elevatedReady = () => ["ROOT","ADB"].some(k => PROVIDERS[k] && PROVIDERS[k].status === "ready");
const elevatedProvider = () => ["ROOT","ADB"].find(k => PROVIDERS[k] && PROVIDERS[k].status === "ready") || null;
function resolve(tool) {
  const reasons = [];
  if (tool.minSdk && DEVICE.sdkInt < tool.minSdk) reasons.push(`Requires Android API ${tool.minSdk}+`);
  tool.feats.forEach(f => { if (!DEVICE.features[f]) reasons.push(`Hardware missing: ${f}`); });
  tool.perms.forEach(p => { if (!S.perms[p]) reasons.push(`Permission required: ${p}`); });
  tool.caps.forEach(c => {
    if (c === "ELEVATED_SHELL") {
      if (!elevatedReady()) reasons.push("Needs elevated provider: root or a connected wireless ADB session");
      return;
    }
    const kind = CAP2KIND[c], p = PROVIDERS[kind];
    if (!p || p.status !== "ready") {
      const d = !p ? "No provider registered"
        : p.status === "setup" ? `setup required — ${p.instructions}` : p.reason;
      reasons.push(`Needs ${kind} provider: ${d}`);
    }
  });
  return reasons.length ? { blocked: reasons } : { ready: true };
}

function renderToolList(){

  if(nq && S.toolsCategory){
    // Category + query filters by plain contains, mirroring visibleTools().
    list.forEach(x => x._s = (x.title.toLowerCase().includes(q) || x.description.toLowerCase().includes(q)) ? 0 : null);
  } else if(nq){
    list.forEach(x => x._s = scoreFields(x.title, x.keywords.concat(TOOL_KW[x.id]||[]), x.description, nq));
  } else list.forEach(x => x._s = 0);
  const scored = list.filter(x => x._s!=null).sort((a,b)=>b._s-a._s || a.title.localeCompare(b.title));

function scrReview(){

  const order = [["PASS","PASS"],["FAIL","FAIL"],["NOT_TESTED","SKIPPED"],["NOT_SUPPORTED","NOT SUPPORTED"],["PERMISSION_REQUIRED","PERMISSION"],["UNKNOWN","UNKNOWN"]];
  const summary = order.filter(([k])=>counts[k]).map(([k,l])=>`${l} ${counts[k]}`).join(" · ") || "No results recorded";
  const groups = {};
  Object.keys(e.results).forEach(tid => { const c = TEST(tid)?.cat||"Other"; (groups[c]=groups[c]||[]).push(tid); });
  const retryable = Object.entries(e.results).filter(([,st])=>st==="FAIL"||st==="NOT_TESTED").map(([k])=>k);
  return `<div class="pad col">
    <div class="card"><div class="t-small">${summary}</div></div>

      `<div class="sec-head">${c}</div>` + ids.map(tid => {

        return `<div class="card"><div class="row"><span class="grow t-med">${TEST(tid)?.title||tid}</span>

    const names=["Red","Green","Blue","White","Black"];
    let i=0, hidden=false;
    const box=$("#colorbox"), card=$("#colorcard"), label=$("#colorlabel");
    card.addEventListener("click",e=>e.stopPropagation());
    $("#colorwrap").addEventListener("click",()=>{
      if(!hidden){hidden=true;card.style.display="none";}
      else if(i<colors.length-1){i++;box.style.background=colors[i];label.textContent=`Showing ${names[i]} (${i+1}/5) — ${test.id==="display.dead_pixel"?"inspect every pixel before tapping":"tap to switch color"}`;}
      else {hidden=false;card.style.display="block";}
    });
    S.displayProgress = () => `inspected through ${names[i]} (${i+1}/5)`;
  }
  if(test.id==="touch.grid"){
    const wrap=$("#tgcanvas"), label=$("#tglabel"), pass=$("#passbtn");
    const covered=new Set(); let down=false;
    const rect=()=>wrap.getBoundingClientRect();
    function mark(e){ const r=rect();
      const col=Math.min(7,Math.floor((e.clientX-r.left)/(r.width/8)));
      const row=Math.min(11,Math.floor((e.clientY-r.top)/(r.height/12)));
      if(col<0||row<0)return;
      const cell=row*8+col;
      if(covered.has(cell))return;
      covered.add(cell);
      const d=document.createElement("div"); d.className="tg-cell";
      d.style.cssText=`left:${col/8*100}%;top:${row/12*100}%;width:${100/8}%;height:${100/12}%;background:rgba(76,175,80,.4)`;
      wrap.appendChild(d);
      label.textContent=`Touch grid — ${covered.size}/96 cells covered`;
      if(covered.size/96>=0.9) pass.disabled=false;
    }
    // draw grid lines
    let lines="";
    for(let c=1;c<8;c++) lines+=`<div class="tg-cell" style="left:${c/8*100}%;top:0;width:1px;height:100%;background:rgba(128,128,128,.5)"></div>`;
    for(let rr=1;rr<12;rr++) lines+=`<div class="tg-cell" style="top:${rr/12*100}%;left:0;height:1px;width:100%;background:rgba(128,128,128,.5)"></div>`;
    wrap.innerHTML=lines;
    wrap.addEventListener("pointerdown",e=>{down=true;wrap.setPointerCapture(e.pointerId);mark(e);});
    wrap.addEventListener("pointermove",e=>{if(down)mark(e);});
    wrap.addEventListener("pointerup",()=>down=false);
    // stash coverage for the note
    S.tgCoverage = () => `Coverage ${covered.size}/96 (${Math.round(covered.size/96*100)}%)`;
  }
  if(test.id==="touch.multitouch"){
    const wrap=$("#mtwrap"), label=$("#mtlabel");
    const colors=["#E91E63","#3F51B5","#009688","#FF9800","#9C27B0","#4CAF50","#FFC107","#00BCD4","#795548","#607D8B"];
    const active=new Map(); let max=0;
    function draw(){
      wrap.querySelectorAll(".mt-dot").forEach(d=>d.remove());
      active.forEach((p,id)=>{
        const c=colors[id%colors.length];
        const d=document.createElement("div"); d.className="mt-dot";
        d.style.cssText=`left:${p.x}px;top:${p.y}px;width:90px;height:90px;background:${c}59;border:3px solid ${c}`;
        wrap.appendChild(d);
      });
      label.textContent=`Multitouch — active: ${active.size}, max seen: ${max}`;
    }
    function pos(e){ const r=wrap.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
    wrap.addEventListener("pointerdown",e=>{ active.set(e.pointerId,pos(e)); if(active.size>max)max=active.size; draw(); });
    wrap.addEventListener("pointermove",e=>{ if(active.has(e.pointerId)){active.set(e.pointerId,pos(e));draw();} });
    const up=e=>{active.delete(e.pointerId);draw();};
    wrap.addEventListener("pointerup",up); wrap.addEventListener("pointercancel",up);
    S.mtMax = () => `Max simultaneous pointers: ${max}`;
  }
  if(test.sensor!==undefined){
    const s=SENSORS.find(x=>x.type===test.sensor);
    const el=$("#sread");
    let n=0;
    every(()=>{ n++;
      const vals = s.axes.map(ax=>{
        const base={x:0.4,y:9.4,z:0.8,value:s.type===5?Math.abs(Math.sin(n/6))*400+40:s.type===8?(n%20<10?0:5):1013.2,w:0.5}[ax]??0;
        return (base + Math.sin(n/4 + ax.charCodeAt(0))* (ax==="value"&&s.type===5?30:0.25)).toFixed(3);
      });
      el.innerHTML = s.axes.map((ax,i)=>`<div class="row"><span class="grow t-body">${ax}</span><span class="t-body">${vals[i]} ${s.unit}</span></div>`).join("");
      S.sensorLast = () => `Last reading: ${vals.join(", ")}`;
    },300);
  }
  if(test.capKey && mode==="guided"){
    const r=capReading(test.capKey);
    later(()=>emitResult(test, r.supported?"PASS":"NOT_SUPPORTED", r.supported?`${r.label}: ${r.value}`:r.label),1100);
  }
}
function emitResult(test, state, auto){
  const note = $("#tnote")?.value?.trim() || null;
  let autoNote = auto;
  if(test.id==="touch.grid" && S.tgCoverage) autoNote=S.tgCoverage();
  if(test.id==="touch.multitouch" && S.mtMax) autoNote=S.mtMax();
  if(test.id.startsWith("display.") && S.displayProgress) autoNote=S.displayProgress();
  if(test.sensor!==undefined && S.sensorLast) autoNote=S.sensorLast();
  if(test.id==="audio.speaker"){ const n=+($("#playcount")?.dataset.n||0); autoNote=n?`tone played ${n} time(s)`:"tone never played"; }
  if(test.id==="audio.microphone") autoNote=$("#micplay")?.disabled===false?"recording captured":"no recording captured";
  if(test.id==="haptics.vibration") autoNote=S.vib?`buzz triggered ${S.vib} time(s)`:"buzz never triggered";
  if(test.id==="camera.front"||test.id==="camera.rear") autoNote="preview rendered";
  if(test.id==="camera.flash"){ const n=+($("#torchbtn")?.dataset.n||0); autoNote=n?`torch toggled ${n} time(s)`:"torch never toggled"; }
  if(test.id==="power.charging"){ const b=DEVICE.battery; autoNote=`Level ${b.level}%, ${b.status}, plug ${b.plug}`; }
  const full = [note, autoNote].filter(Boolean).join("; ") || null;
  if(S.engine && S.stack.includes("diagnose/guided") || cur()==="diagnose/guided"){
    const e=S.engine;
    e.results[test.id]=state; if(full)e.notes[test.id]=full;
    const sess=S.sessions.find(x=>x.id===e.sessionId);
    if(sess){ sess.results[test.id]={state,note:full}; }
    e.index++;
    if(e.index>=e.queue.length){ replace("diagnose/review"); } else render();
  } else {
    goBack();
  }
}

/* ---------- insights ---------- */
function sessStats(s){
  const c={PASS:0,FAIL:0,SKIP:0,total:0};
  Object.values(s.results).forEach(r=>{ c.total++;
    if(r.state==="PASS")c.PASS++; else if(r.state==="FAIL")c.FAIL++; else c.SKIP++; });
  c.rate=c.total?c.PASS/c.total:0; return c;
}
function insightSessions(){
  const cutoff = S.insightRange==="30d" ? Date.now()-30*86400000 : 0;
  return S.sessions.filter(x=>x.status==="COMPLETED"&&x.started>=cutoff)
    .sort((a,b)=>a.started-b.started);
}
function donutSvg(st){
  const size=104, rr=43, C=2*Math.PI*rr, tot=st.total||1; let off=0;
  const seg=(frac,color)=>{ if(frac<=0)return""; const len=frac*C;
    const el=`<circle cx="52" cy="52" r="${rr}" fill="none" stroke="${color}" stroke-width="15" stroke-dasharray="${len.toFixed(1)} ${(C-len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"/>`;
    off+=len; return el; };
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="52" cy="52" r="${rr}" fill="none" stroke="var(--card2)" stroke-width="15"/>
    ${seg(st.PASS/tot,"var(--primary)")}${seg(st.FAIL/tot,"var(--error)")}${seg(st.SKIP/tot,"var(--outline)")}</svg>`;
}
function barsSvg(points){
  const w=340,h=104,n=points.length,gap=(w-20)/n,bw=Math.min(36,gap-10),base=h-22;
  const bars=points.map((p,i)=>{
    const bh=Math.max(3,Math.round(p.rate*(base-10)));
    const x=10+i*gap+(gap-bw)/2, y=base-bh;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${p.fail?"var(--error)":"var(--primary)"}"><title>${esc(p.title)}</title></rect>
      <text x="${x+bw/2}" y="${h-6}" text-anchor="middle" font-size="9.5" fill="var(--sub)">${esc(p.label)}</text>`;
  }).join("");
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}">
    <line x1="10" y1="${base}" x2="${w-10}" y2="${base}" stroke="var(--outline)" stroke-width="1" opacity=".5"/>${bars}</svg>`;
}
function sparkSvg(vals){
  const w=300,h=44,min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||1;
  const pts=vals.map((v,i)=>`${(10+i*(w-20)/(vals.length-1)).toFixed(1)},${(8+(1-(v-min)/span)*(h-18)).toFixed(1)}`).join(" ");
  const [lx,ly]=pts.split(" ").pop().split(",");
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lx}" cy="${ly}" r="3.5" fill="var(--primary)"/></svg>`;
}
function testAttention(list){
  const agg={};
  list.forEach(s=>Object.entries(s.results).forEach(([tid,r])=>{
    const a=agg[tid]||(agg[tid]={fails:0,skips:0});
    if(r.state==="FAIL")a.fails++; else if(r.state!=="PASS")a.skips++;
  }));
  return Object.entries(agg).filter(([,a])=>a.fails||a.skips)
    .sort((x,y)=>(y[1].fails*2+y[1].skips)-(x[1].fails*2+x[1].skips)).slice(0,4);
}
function insightsHomeCard(){

function scrInsights(){

  const list=insightSessions(), latest=list[list.length-1], prev=list[list.length-2];
  let health;
  if(latest){
    const st=sessStats(latest), p=prev?sessStats(prev):null, pct=Math.round(st.rate*100);

          <span class="t-mini ${a.fails?"err":"sub"}" style="font-weight:600">${a.fails?a.fails+"× fail":""}${a.fails&&a.skips?" · ":""}${a.skips?a.skips+"× skipped/other":""}</span></div>

      :`<div class="card"><div class="t-body">No failed or skipped tests in range.</div></div>`}`;
  } else {
    health=`<div class="card"><div class="t-body">No completed diagnostics in this range.</div>
      <div class="t-mini sub" style="margin-top:4px">Run a Full Diagnostic to start building health trends.</div></div>
      <button class="btn full" data-nav="diagnose">Start Full Diagnostic</button>`;
  }
  const snaps=S.snapshots.filter(x=>x.free!=null).sort((a,b)=>a.at-b.at);
  const d=snaps.length>=2?snaps[snaps.length-1].free-snaps[0].free:0;
  const storage=snaps.length>=2
    ?`<div class="card">${sparkSvg(snaps.map(s=>s.free))}
      ${infoRow("Free space now",fmtBytes(snaps[snaps.length-1].free),false)}

      <div class="t-mini sub" style="margin-top:2px">Internal storage free space per snapshot — captured in Storage Lab.</div></div>`
    :`<div class="card"><div class="t-body">No storage trend yet.</div>
      <div class="t-mini sub" style="margin-top:4px">Capture two or more snapshots in Storage Lab to chart free space.</div></div>`;
  const completed=S.sessions.filter(x=>x.status==="COMPLETED");
  const testsRun=completed.reduce((n,s)=>n+Object.keys(s.results).length,0);
  const tiles=[["Diagnostics",completed.length],["Tests recorded",testsRun],

    ["Snapshots",S.snapshots.length],["Elevated actions",S.elevLog.length]];
  const top=Object.entries(S.toolUse).sort((a,b)=>b[1]-a[1]).slice(0,3), topMax=top.length?top[0][1]:1;
  const topHtml=top.length?top.map(([id,n])=>{const t=TOOLS.find(x=>x.id===id);if(!t)return"";
      return`<div class="card clickable" data-nav="${t.route}" data-tool="${t.id}">

  return `<div class="pad col">${rangeChips}
    <div class="sec-head" style="padding-top:0">Device health</div>

    ${storage}

  later(()=>{ // start fake stream after mount

        const v={x:0.4+Math.sin(n/5)*1.2,y:9.4+Math.cos(n/6)*.8,z:0.8+Math.sin(n/4)*.4,
          value:s.type===5?Math.abs(Math.sin(n/7))*500+60:s.type===8?(n%16<8?0:5):s.type===6?1013+Math.sin(n/9)*2:0.5,w:0.5+Math.sin(n/8)*.1}[ax]??0;
        const cell=$("#lv"+i); if(cell) cell.textContent=v.toFixed(3)+" "+s.unit;
        const bar=$("#lb"+i); if(bar) bar.style.width=Math.min(100,Math.abs(v)/s.range*100)+"%";

/* ---------- compare sessions ---------- */
function scrCompare(){
  const done=S.sessions.filter(s=>s.status==="COMPLETED");
  const c=S.cmp;
  if(done.length<2) return `<div class="pad empty">Run at least two diagnostic sessions to compare before/after.</div>`;
  const pick=(which)=>`<div class="chiprow">${done.map(s=>
    `<button class="fchip ${c[which]===s.id?"sel":""}" data-cmp="${which}:${s.id}">${fmtDT(s.started)}${s.deviceLabel||s.customerLabel?" · "+esc(s.deviceLabel||s.customerLabel):""}</button>`).join("")}</div>`;
  let result="";
  if(c.done&&c.before&&c.after){
    const b=done.find(s=>s.id===c.before), a=done.find(s=>s.id===c.after);
    const bres=b?.results||{}, ares=a?.results||{};
    const rows=[]; let unchanged=0;
    [...new Set([...Object.keys(bres),...Object.keys(ares)])].forEach(tid=>{
      const bs=bres[tid]?.state||null, as=ares[tid]?.state||null;
      if(bs===as){unchanged++;return;}
      let tr="CHANGED";
      if(as==="PASS"&&bs==="FAIL")tr="FIXED";
      else if(as==="PASS")tr="IMPROVED";
      else if(bs==="PASS")tr="REGRESSED";
      else if(!bs)tr="ADDED"; else if(!as)tr="REMOVED";
      const rc={FIXED:"pass",IMPROVED:"inf",REGRESSED:"fail",CHANGED:"warn",ADDED:"inf",REMOVED:"skip"}[tr]||"skip";
      rows.push({tid,tr,bs,as,rc});
    });
    result=`<div class="sec-head">Test transitions</div>
      ${rows.length?rows.map(r=>`<div class="card"><div class="row">
        <span class="res ${r.rc}" style="width:86px;justify-content:center">${r.tr}</span>
        <div class="grow"><div class="t-med">${r.tid}</div><div class="t-mini sub">${r.bs||"—"} → ${r.as||"—"}</div></div></div></div>`).join("")
        :`<div class="t-body">No state changes between sessions.</div>`}
      ${unchanged?`<div class="t-mini sub">${unchanged} tests unchanged.</div>`:""}
      <div class="sec-head">Device changes</div>
      <div class="card"><div class="t-small">Free storage</div><div class="t-mini sub">68.2 GB → ${fmtBytes(DEVICE.storageFree)}</div></div>`;
  }
  return `<div class="pad col">
    <div class="sec-head">Before</div>${pick("before")}
    <div class="sec-head">After</div>${pick("after")}
    <button class="btn full" data-act="cmp-run" ${c.before&&c.after&&c.before!==c.after?"":"disabled"}>Compare</button>
    ${result}
  </div>`;
}

const AI_CUE_ICON={POSITIVE:"check_circle",WARNING:"warning",NEGATIVE:"cancel",INFO:"info"};
const AI_CUE_CLS={POSITIVE:"ok",WARNING:"warn",NEGATIVE:"bad",INFO:"inf"};
const AI_NEG_BAD=/\b(no|not|nothing|without|never|hardly|barely|no signs of)\s+(?:a|an|the|any|signs of)\s*(abnormal\w*|unusual|fail(ed|ing|s|ure)?|failures?|issues?|problems?|errors?|critical|wrong|high|low|hot|bad)\b/ig;
const AI_NEG_GOOD=/\b(no|not|nothing|isn't|isnt|without|never|hardly|barely)\s+(?:a|an|the|any)\s*(normal|healthy|good|fine|ok(ay)?|passed?|in range|within (the )?normal)\b/ig;
function aiCue(t){
  const s=t.replace(AI_NEG_BAD," ").replace(AI_NEG_GOOD," ");
  let cue="NONE";
  if(/\b(fail(ed|ing|s|ure)?|critical|needs attention|errors?|dead|broken|not working)\b|[❌✗✘🔴]/i.test(s))cue="NEGATIVE";
  else if(/\b(worth checking|unusual|warnings?|warn|abnormal|elevated|high|low|overheat(ing)?|hot)\b|[⚠🟡🟠]/i.test(s))cue="WARNING";
  else if(/\b(all good|normals?|pass(ed)?|healthy|ok(ay)?|in range|within (the )?normal|looks good|no issues?)\b|[✅✓✔🟢]/i.test(s))cue="POSITIVE";
  else if(/^(note|tip)\b|[ℹ💡]/i.test(s))cue="INFO";
  if(cue==="NONE"){
    AI_NEG_GOOD.lastIndex=0; AI_NEG_BAD.lastIndex=0;
    if(AI_NEG_GOOD.test(t))cue="WARNING"; else if(AI_NEG_BAD.test(t))cue="POSITIVE";
  }
  return cue;
}
const aiStripLead=s=>s.replace(/^[\s✅❌⚠✓✔✗✘🟢🔴🟡🟠ℹ💡🔥⭐️]+/,"");
function fmtInline(s){

  h=h.replace(/\*\*([^*\s](?:[^]*?[^*\s])?)\*\*/g,"<b>$1</b>")
     .replace(/(?<![A-Za-z0-9_])__([^_\s](?:[^]*?[^_\s])?)__(?![A-Za-z0-9_])/g,"<b>$1</b>")
     .replace(/\*([^*\s](?:[^]*?[^*\s])?)\*/g,"<i>$1</i>")
     .replace(/(?<![A-Za-z0-9_])_([^_\s](?:[^]*?[^_\s])?)_(?![A-Za-z0-9_])/g,"<i>$1</i>")

const aiIco=cue=>`<span class="ai-ico ${AI_CUE_CLS[cue]}"><svg viewBox="0 0 24 24"><path d="${ICONS[AI_CUE_ICON[cue]]||ICONS.info}"/></svg></span>`;
function fmtAiProse(s){
  const out=[]; let para=[];
  const flush=()=>{ if(!para.length)return;
    const joined=para.join(" "); para=[];
    const cue=aiCue(joined);
    const h=fmtInline(cue==="NONE"?joined:aiStripLead(joined));
    if(h) out.push(`<div class="ai-line">${cue==="NONE"?"":aiIco(cue)}${h}</div>`);
  };
  for(const raw of s.split("\n")){
    const t=raw.trim(); if(!t){flush();continue;}
    let m;
    if(/^\s*([\-*_])(\s*\1){2,}\s*$/.test(t)){flush();out.push(`<div class="ai-hr"></div>`);continue;}
    if(m=t.match(/^#{1,6}\s+(.+)$/)){flush();out.push(`<div class="ai-h">${fmtInline(aiStripLead(m[1]))}</div>`);continue;}
    if(m=t.match(/^(all good|worth checking|needs attention)\b[\s:—–.,!-]*(.*)$/i)){
      flush();
      const ph=m[1].toLowerCase(), cue=ph==="all good"?"POSITIVE":ph==="worth checking"?"WARNING":"NEGATIVE";
      const rest=fmtInline(aiStripLead(m[2]));
      out.push(`<div class="ai-line"><span class="ai-verdict ${AI_CUE_CLS[cue]}">${ph[0].toUpperCase()+ph.slice(1)}</span>`+
        (rest?`<span>${rest}</span>`:"")+`</div>`);
      continue;
    }
    if(m=t.match(/^[-*+•]\s+(.+)$/)){flush();
      const cue=aiCue(m[1]), body=cue==="NONE"?m[1]:aiStripLead(m[1]);
      out.push(`<div class="ai-line">${cue==="NONE"?`<span class="ai-dot">•</span>`:aiIco(cue)}${fmtInline(body)}</div>`);continue;}
    if(m=t.match(/^(\d{1,2})[.)]\s+(.+)$/)){flush();
      const cue=aiCue(m[2]), body=cue==="NONE"?m[2]:aiStripLead(m[2]);
      out.push(`<div class="ai-line"><span class="ai-num">${m[1]}.</span>${fmtInline(body)}</div>`);continue;}
    para.push(t.replace(/^#+/,""));
  }
  flush();
  return out.join("");
}
function fmtAi(text){
  return text.split("```").map((p,i)=>{
    const s=p.trim(); if(!s) return "";
    if(i%2===1){
      const nl=s.indexOf("\n"), first=(nl<0?s:s.slice(0,nl)).toLowerCase();
      const body=nl>0&&/^(json|kotlin|java|bash|sh|shell|xml|yaml|text)$/.test(first)?s.slice(nl+1).trim():s;
      return `<span class="code">${esc(body)}</span>`;
    }
    return fmtAiProse(s);
  }).join("");
}

      a.busy=true; render();
      later(()=>{ a.busy=false; a.paired=true; if(cur()==="adb")render(); toast("Paired — identity saved"); },900); break; }
    case "adb-connect-manual": { const a=S.adb;
      a.connHost=$("#adbConnHost")?.value||""; a.connPort=$("#adbConnPort")?.value||"";
      if(!a.paired){ toast("Pair first — no stored identity"); break; }
      if(!a.connPort){ toast("Enter connect port"); break; }
      a.busy=true; render();
      later(()=>{ a.busy=false; a.session=`${a.connHost||a.pairHost}:${a.connPort}${a.useTls?" (TLS)":""}`;
        PROVIDERS.ADB={status:"ready"};
        if(cur()==="adb")render(); toast("ADB session established — elevated tools unlocked"); },1300); break; }
    case "adb-disconnect": S.adb.session=null; S.adb.pairState="idle";
      PROVIDERS.ADB={status:"setup",instructions:"enable wireless debugging in Developer options, then pair"};
      render(); toast("Disconnected"); break;
    case "adb-props": S.adb.props=[["ro.product.model","Pixel 8 Pro"],["ro.build.version.release","15"],
      ["ro.build.version.sdk","35"],["ro.serialno","3A181JEHN08842"],
      ["ro.build.fingerprint","google/husky/husky:15/AP4A.250905.014/14070145:user/release-keys"]];
      pushElevLog("getprop"); render(); break;
    case "adb-log": { const n=$("#adbLogLines")?.value||"200"; S.adb.logLines=n;
      S.adb.log=["09:41:12.331  I  ActivityManager: Start proc io.github.droidkit",
        "09:41:12.874  D  OpenGLRenderer: Skia GL pipeline",
        "09:41:13.012  I  DroidKit: capability resolve — ADB ready",
        "09:41:13.204  W  InputReader: device associated",
        "09:41:14.556  I  ThermalEngine: sensor=skin_therm temp=31.4"].join("<br>");
      pushElevLog("logcat -d -t "+n); render(); break; }
    case "adb-reboot": dialog({title:"Reboot this device?",
      text:"The device will power off and restart immediately. Unsaved work in other apps is lost.",
      confirm:"Reboot",cancel:"Cancel",danger:true,onConfirm:"adb-reboot"}); break;
    case "files-up": { const p=S.files.path, parent=p.substring(0,p.lastIndexOf("/"))||"/sdcard";
      S.files.path = parent; render(); break; }
    case "files-open": { const p=el.dataset.p;
      if(FILES_MOCK[p]){ S.files.path=p; render(); }
      else toast("Folder (mock — no deeper listing)"); break; }
    case "files-copy": { const p=el.dataset.p, name=p.substring(p.lastIndexOf("/")+1);
      S.files.copying=p; render();
      later(()=>{ S.files.copying=null; toast(`Copied to /sdcard/Download/DroidKit/${name}`); render(); },700);
      pushElevLog("cp -r "+p); break; }
    case "cmp-run": S.cmp.done=true; render(); break;
    case "req-perm": sysPermDialog(el.dataset.perm, true); break;
    case "note-toggle": {
      const tb=$("#testbar");
      tb.insertAdjacentHTML("afterbegin",`<input class="field" id="tnote" placeholder="Note (optional)" style="margin-bottom:8px">`);
      $("#tnote").focus(); break; }
    case "vibrate": S.vib=(S.vib||0)+1; navigator.vibrate?.(400); tone(180,.12,.08); toast("Buzz (simulated on desktop)"); break;
    case "playtone": { tone(440,1); const c=$("#playcount"); c.dataset.n=(+c.dataset.n||0)+1; c.textContent=`Played ${c.dataset.n} time(s)`; break; }
    case "mic-rec": { const b=$("#micrec"),st=$("#micstate");
      if(b.dataset.rec){ b.dataset.rec="";b.textContent="Record 3s+";st.textContent="Recording saved (3.0 s)";$("#micplay").disabled=false; }
      else { b.dataset.rec="1";b.textContent="Stop";st.textContent="Recording…"; 
        later(()=>{ if($("#micrec")?.dataset.rec){$("#micrec").dataset.rec="";$("#micrec").textContent="Record 3s+";$("#micstate").textContent="Recording saved (3.0 s)";$("#micplay").disabled=false;} },3000); }
      break; }
    case "mic-play": tone(330,.5); later(()=>tone(392,.5),400); toast("Playing back recording"); break;
    case "torch": { const b=$("#torchbtn"),on=b.dataset.on==="1";b.dataset.on=on?"":"1";b.dataset.n=(+b.dataset.n||0)+1;
      b.textContent=on?"Turn torch ON":"Turn torch OFF";
      $("#torchstate").textContent=on?"":"Torch is ON — check the LED on the back.";
      $(".camview, .phone").classList?.toggle?.("torch-on",!on); break; }
    case "charge-refresh": $("#chargeread").innerHTML=chargeReading(); toast("Reading refreshed"); break;
    case "adv-load": S.advLoaded=true; render(); break;
    case "saved-reveal": { const s=$("#psk"+el.dataset.i);
      if(!s) break;
      if(s.dataset.shown==="1"){ s.textContent="••••••••"; s.dataset.shown="0"; el.textContent="Reveal"; }
      else { s.textContent=s.dataset.v; s.dataset.shown="1"; el.textContent="Hide"; }
      break; }
    case "netdiag": $("#netdiag").innerHTML=`<div class="t-body"><span class="spin"></span>Running…</div>`;
      later(()=>{ if($("#netdiag"))$("#netdiag").innerHTML=netLayers(); },800); break;
    case "ping": { const h=$("#pinghost").value.trim(); if(!h)break;
      $("#pingout").innerHTML=`<div class="t-body">Probing…</div>`;
      later(()=>{ if($("#pingout"))$("#pingout").innerHTML=
        infoRow("Resolved","142.250.72.14")+infoRow("Replies","4/4 (0% loss)",false)+
        infoRow("Min / Avg / Max","11.8 ms / 14.2 ms / 19.5 ms",false)+
        `<div class="t-mini sub">ICMP echo is often filtered — no reply does not prove the host is down.</div>`; },900); break; }
    case "dns": { const h=$("#dnshost").value.trim(); if(!h)break;
      $("#dnsout").innerHTML=`<div class="t-body">Resolving…</div>`;
      later(()=>{ if($("#dnsout"))$("#dnsout").innerHTML=
        infoRow("Address","142.250.72.14")+infoRow("Address","2607:f8b0:4006:80e::200e")+infoRow("Elapsed","18 ms",false); },600); break; }
    case "bt-enable": dialog({title:"Enable Bluetooth?",text:"An app wants to turn Bluetooth on.",confirm:"Allow",cancel:"Deny",onConfirm:"bt-on"}); break;
    case "nfc-scan": { const n=S.nfc;
      if(n.scanning||n.armed){ n.scanning=false;n.armed=null; }
      else { n.scanning=true; n.result=null;
        later(()=>{ if(S.nfc.scanning){ S.nfc.tag={...NFC_TAG}; S.nfc.scanning=false; if(cur()==="nfc")render(); } },1600); }
      render(); break; }
    case "nfc-erase": dialog({title:"Erase tag?",text:"This writes an empty NDEF message to the next presented tag, removing its current content. Present the tag after confirming.",confirm:"Erase next tag",cancel:"Cancel",onConfirm:"nfc-arm-erase"}); break;
    case "nfc-disarm": S.nfc.armed=null; render(); break;
    case "nfc-write": { const size=(S.nfcInput||"").length+7;
      dialog({title:"Write to tag?",text:`This writes a ${size}-byte NDEF message to the next presented tag, replacing its current content. The tag must be writable and have enough capacity.`,confirm:"Arm write",cancel:"Cancel",onConfirm:"nfc-arm-write"}); break; }
    case "usb-perm": S.usbPermPending[el.dataset.dev]=true; render();
      later(()=>{ S.usbPermPending={}; S.usbPerm[el.dataset.dev]=true; if(cur().startsWith("usb/"))render(); },1200); break;
    case "copy-usb": navigator.clipboard?.writeText("USB2.0 Flash Disk 090C:1000 Mass Storage").catch(()=>{}); toast("USB summary copied"); break;
    case "share-usb": toast("Sharesheet would open (mock)"); break;
    case "copy-section": navigator.clipboard?.writeText("["+el.dataset.sec+"]").catch(()=>{}); toast("Section copied"); break;
    case "share-device": toast("Sharesheet would open (mock)"); break;
    case "launch-app": toast(`Would launch ${el.dataset.app} (mock)`); break;
    case "app-settings": toast(`Would open system settings for ${el.dataset.app}`); break;
    case "intent": toast(`Would launch intent ${el.dataset.intent}`); break;
    case "custom-intent": toast("Would launch custom intent"); break;
    case "reports-menu": {
      const ov=$("#overlay");
      ov.innerHTML=`<div class="scrim" data-act="dlg-close"></div>
        <div class="menu"><div class="mi" data-act="del-all">Delete all reports</div></div>`; break; }
    case "del-all": dialog({title:"Delete all reports?",text:"Every diagnostic session, result and saved report entry is deleted permanently.",confirm:"Delete all",cancel:"Cancel",danger:true,onConfirm:"del-all"}); break;
    case "copy-summary": navigator.clipboard?.writeText("DroidKit report summary").catch(()=>{}); toast("Summary copied"); break;
    case "export": { const ov=$("#overlay"); let fmt="TEXT";
      ov.innerHTML=`<div class="scrim" data-act="dlg-close"></div>
        <div class="sheet"><div class="t-med" style="font-weight:600">Export preview</div>
          <div class="t-mini" style="margin:6px 0 8px">This report contains:</div>
          <div class="t-mini">• Session ID, date and app version</div>
          <div class="t-mini">• Device manufacturer, model, Android release, security patch</div>
          <div class="t-mini">• RAM, storage, display and provider capability summary</div>
          <div class="t-mini">• Every test result, state and technician note</div>
          <div class="chiprow" style="margin-top:12px">
            <button class="fchip sel" data-fmt="TEXT">Text (.txt)</button>
            <button class="fchip" data-fmt="PDF">PDF (.pdf)</button>
            <button class="fchip" data-fmt="CERT">Certificate (.pdf)</button></div>
          <button class="btn full" style="margin-top:14px" data-act="share-report">Share <span id="fmtLbl">TEXT</span> report</button>
        </div>`; break; }
    case "share-report": closeOverlay(); toast("Report exported & sharesheet opened (mock)"); break;
    case "delete-report": { const id=cur().split("/").pop(); const s=S.sessions.find(x=>x.id===id);
      dialog({title:"Delete report?",text:`This session and its ${s?Object.keys(s.results).length:0} results are deleted permanently.`,confirm:"Delete",cancel:"Cancel",danger:true,onConfirm:"del-report:"+id}); break; }
    case "retry-tests": { const e=S.engine;
      const retryable=Object.entries(e.results).filter(([,st])=>st==="FAIL"||st==="NOT_TESTED").map(([k])=>k);
      e.queue=TESTS.filter(x=>retryable.includes(x.id)); e.index=0;
      replace("diagnose/guided"); break; }
    case "save-session": { const e=S.engine;
      const sess=S.sessions.find(x=>x.id===e.sessionId);
      if(sess){ sess.status="COMPLETED"; sess.notes=$("#reviewNotes")?.value?.trim()||null; }
      S.engine=null; S.tab="diagnose"; S.stack=["diagnose"]; closeOverlay(); render(); toast("Session saved"); break; }
  }
}
function dlgOk(cb){
  if(!cb)return;
  if(cb.startsWith("grant:")){ const p=cb.slice(6); S.perms[p]=true; render(); return; }
  switch(true){
    case cb==="reset-settings": S.theme="dark"; $("#phone").dataset.theme="dark";
      S.technician=""; S.favorites.clear(); S.recentTools=[]; S.toolUse={};
      render(); toast("Settings reset"); break;
    case cb==="bt-on": S.btEnabled=true; render(); break;
    case cb==="del-all": S.sessions=[]; S.engine=null; render(); break;
    case cb.startsWith("del-report:"): { const id=cb.split(":")[1];
      S.sessions=S.sessions.filter(x=>x.id!==id); goBack(); break; }
    case cb==="nfc-arm-erase": S.nfc.armed="erase"; S.nfc.tag=null;
      later(()=>{ if(S.nfc.armed){S.nfc.armed=null;S.nfc.result="Tag erased — empty NDEF message written.";if(cur().startsWith("nfc"))render();} },2200); render(); break;
    case cb==="nfc-arm-write": S.nfc.armed="write";
      later(()=>{ if(S.nfc.armed){S.nfc.armed=null;S.nfc.result="NDEF message written successfully.";if(cur().startsWith("nfc"))render();} },2200); render(); break;
    case cb==="adb-reboot": toast("Rebooting (mock)"); break;
    case cb.startsWith("appop:"): { const [,op,m]=cb.split(":");
      const o=appopsFor(S.appopsSel).find(x=>x.op===op); if(o)o.mode=m;
      pushElevLog(`appops set ${S.appopsSel} ${op} ${m}`); render(); break; }
    case cb.startsWith("pkg:"): { const [,act2,pkg]=cb.split(":");
      pushElevLog(`pm ${act2==="disable"?"disable-user":act2==="clear"?"clear":"uninstall --user 0"} ${pkg}`);
      toast(`${act2} ${pkg} — done (mock)`); break; }
  }
}
function pushElevLog(command, exit=0){
  const t=new Date().toLocaleTimeString("en-US",{hour12:false});
  S.elevLog.unshift({time:t,provider:(elevatedProvider()||"adb").toLowerCase(),exit,command});
}
function sendAi(v){
  if(!v||S.ai.busy)return;
  S.ai.turns.push({role:"user",text:v}); S.ai.busy=true; render();
  later(()=>{ S.ai.busy=false;
    S.ai.turns.push({role:"assistant",
      text:"ALL GOOD — your battery looks healthy.\n- Level — normal: 72%, discharging at about 412 mA.\n- Temperature — normal: 31.4 °C.\n- Drain — normal for screen-on use.\n\nI can open a relevant tool if you want to dig deeper.",
      proposals:[
        {label:"Open Battery Lab",allowed:true,action:"nav:battery"},
        {label:"dumpsys batterystats",allowed:elevatedReady(),
         blocked:elevatedReady()?null:"Needs elevated provider",action:"elev:dumpsys batterystats"}],
      suggestions:["Check charging speed","Why is drain high?"]});
    render(); const cl=$("#chatlog"); if(cl)cl.scrollTop=cl.scrollHeight; },1100);
}
function runProposal(key){
  const [i,j]=String(key).split(":").map(Number);
  const t=S.ai.turns[i]; const p=t&&t.proposals&&t.proposals[j]; if(!p||!p.allowed)return;
  if(p.action.startsWith("nav:")){ nav(p.action.slice(4)); return; }
  if(p.action.startsWith("elev:")){ const cmd=p.action.slice(5);
    pushElevLog(cmd);
    S.ai.turns.push({role:"assistant",text:"```\n"+cmd+" → exit 0 (mock output)\n```"});
    render(); const cl=$("#chatlog"); if(cl)cl.scrollTop=cl.scrollHeight; }
}
document.addEventListener("keydown", e=>{
  if(e.target.id==="aiInput"&&e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendAi(e.target.value.trim()); }
});
/* inputs (delegated, no re-render to preserve focus) */
document.addEventListener("input", e=>{
  if(e.target.id==="toolSearch"){ S.toolsQuery=e.target.value; renderToolList(); }
  if(e.target.id==="appSearch"){ S.appsQuery=e.target.value; renderAppList(); }
  if(e.target.id==="nfcinput"){ S.nfcInput=e.target.value;
    const b=$("#body [data-act='nfc-write']"); if(b) b.disabled=!e.target.value.trim(); }
  if(e.target.id==="ci-action"||e.target.id==="ci-data"||e.target.id==="ci-pkg"){
    const a=$("#ci-action").value.trim(),d=$("#ci-data").value.trim(),p=$("#ci-pkg").value.trim();
    $("#ci-preview").textContent=`Intent(action=${a||"…"}${d?", data="+d:""}${p?", package="+p:""})`;
    $("#ci-launch").disabled=!a; }
  if(e.target.id==="appopsQuery"){ S.appopsQuery=e.target.value; const l=$("#appopsList"); if(l)l.innerHTML=appopsListHtml(); }
  if(e.target.id==="pkgQuery"){ S.pkgQuery=e.target.value; const l=$("#pkgList"); if(l)l.innerHTML=pkgListHtml(); }
  if(e.target.id==="pkgRestore"){ S.pkgRestore=e.target.value;
    const b=$("#body [data-act='pkg-restore']"); if(b)b.disabled=!e.target.value.trim(); }
  if(e.target.id==="dl-uri"){ const b=$("#dl-go"); if(b)b.disabled=!e.target.value.trim(); }
});
document.addEventListener("click", e=>{
  const fc=e.target.closest("[data-fmt]");
  if(fc){ document.querySelectorAll("[data-fmt]").forEach(x=>x.classList.remove("sel"));
    fc.classList.add("sel"); $("#fmtLbl").textContent=fc.dataset.fmt; }
  const nk=e.target.closest("[data-nfckind]");
  if(nk){ S.nfcKind=nk.dataset.nfckind; render(); }
  const th=e.target.closest("[data-theme-opt]");
  if(th){ S.theme=th.dataset.themeOpt==="LIGHT"?"light":"dark";
    $("#phone").dataset.theme=S.theme;
    document.querySelectorAll(".segopt").forEach(b=>b.classList.toggle("sel",b===th)); }
  const am=e.target.closest("[data-aimodel]");
  if(am){ S.ai.model=am.dataset.aimodel; }
});
/* gesture bar + size switcher */
$("#sizebar").addEventListener("click", e => {
  const b = e.target.closest("[data-size]"); if(b) setSize(b.dataset.size);
});
$("#gback").addEventListener("click",goBack);
$("#ghome").addEventListener("click",()=>goTab("home"));
$("#grecent").addEventListener("click",()=>toast("Recents (mock)"));
/* clock */
setInterval(()=>{ const d=new Date(); $("#clock").textContent=`${d.getHours()%12||12}:${String(d.getMinutes()).padStart(2,"0")}`; },1000);
render();
</script>
