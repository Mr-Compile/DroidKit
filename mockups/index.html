<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DroidKit — interactive UI mockup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: #0d0f13;
    color: #dde2ea;
    display: flex; flex-direction: column;
  }
  header.page {
    padding: 14px 22px; border-bottom: 1px solid #262b34;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header.page h1 { font-size: 18px; font-weight: 600; }
  header.page .hint { font-size: 13px; color: #8a93a5; }
  .layout { flex: 1; display: flex; min-height: 0; }
  .phone-col {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 18px; gap: 10px; min-width: 430px;
  }
  .route-bar {
    font: 12px/1.4 Consolas, monospace; color: #7fd4c1;
    background: #151a20; border: 1px solid #262b34; border-radius: 8px;
    padding: 5px 12px; max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* ---------- phone frame ---------- */
  .phone {
    width: 392px; height: 800px; border-radius: 36px;
    border: 10px solid #1a1c22; outline: 1px solid #33363f;
    background: #000; position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 24px 60px rgba(0,0,0,.55);
  }
  .phone[data-theme="dark"] {
    --surface: #111318; --card: #1d2129; --card2: #262b34;
    --text: #e3e7ee; --sub: #a3aab8; --outline: #4a5160;
    --primary: #a8c7fa; --on-primary: #0a2a5e; --error: #f2b8b5;
    --tonal: #2a2f3a; --ok: #a8c7fa; --field: #171a20;
  }
  .phone[data-theme="light"] {
    --surface: #fbf8fd; --card: #f0edf4; --card2: #e6e1ea;
    --text: #1b1b21; --sub: #49454f; --outline: #c9c4d4;
    --primary: #425e91; --on-primary: #ffffff; --error: #b3261e;
    --tonal: #e6e1ea; --ok: #425e91; --field: #f3f0f7;
  }
  .statusbar {
    height: 26px; flex: none; display: flex; align-items: center;
    justify-content: space-between; padding: 0 18px;
    font-size: 12px; font-weight: 600; color: var(--text);
    background: var(--surface); z-index: 5;
  }
  .statusbar .sicons { display: flex; gap: 5px; align-items: center; }
  /* ---------- material-ish widgets ---------- */
  #appbar {
    flex: none; min-height: 56px; display: flex; align-items: center;
    padding: 0 16px; background: var(--surface); color: var(--text);
    font-size: 20px; position: relative;
  }
  #appbar .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #appbar .actions { margin-left: auto; display: flex; align-items: center; }
  #appbar .iconbtn { cursor: pointer; padding: 6px; border-radius: 50%; }
  #appbar .iconbtn:hover { background: rgba(128,128,128,.18); }
  #appbar .textbtn { margin-left: 4px; }
  .progress-line { height: 3px; background: var(--card2); flex: none; }
  .progress-line > div { height: 100%; background: var(--primary); transition: width .3s; }
  #body { flex: 1; overflow-y: auto; background: var(--surface); color: var(--text); position: relative; }
  #body::-webkit-scrollbar { width: 4px; }
  #body::-webkit-scrollbar-thumb { background: var(--outline); border-radius: 2px; }
  .pad { padding: 8px 16px 16px; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .card {
    background: var(--card); border-radius: 12px; padding: 16px;
    color: var(--text);
  }
  .card.clickable { cursor: pointer; }
  .card.clickable:hover { background: var(--card2); }
  .t-small { font-size: 14px; font-weight: 600; }
  .t-med { font-size: 15px; }
  .t-body { font-size: 13.5px; line-height: 1.45; }
  .t-mini { font-size: 12px; }
  .sub { color: var(--sub); }
  .err { color: var(--error); }
  .pri { color: var(--primary); }
  .sec-head {
    font-size: 13px; font-weight: 600; color: var(--primary);
    padding: 8px 16px; letter-spacing: .2px;
  }
  .row { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1; min-width: 0; }
  .inforow { display: flex; align-items: center; padding: 4px 0; gap: 8px; }
  .inforow .k { flex: 1; font-size: 13.5px; color: var(--text); }
  .inforow .v { font-size: 13.5px; color: var(--text); text-align: right; word-break: break-all; }
  .inforow .v.na { color: var(--sub); }
  .copybtn { font-size: 12px; color: var(--primary); cursor: pointer; padding: 2px 8px; border-radius: 6px; }
  .copybtn:hover { background: rgba(128,128,128,.15); }
  .btn {
    display: inline-block; border: none; border-radius: 20px; cursor: pointer;
    background: var(--primary); color: var(--on-primary);
    font-size: 14px; font-weight: 600; padding: 10px 18px; text-align: center;
  }
  .btn.full { display: block; width: 100%; }
  .btn:disabled { opacity: .38; cursor: default; }
  .btn-outline {
    background: transparent; color: var(--primary);
    border: 1px solid var(--outline); border-radius: 20px;
    font-size: 14px; font-weight: 600; padding: 9px 16px; cursor: pointer; text-align: center;
  }
  .btn-outline:disabled { opacity: .38; cursor: default; }
  .textbtn {
    background: none; border: none; color: var(--primary); font-size: 13.5px;
    font-weight: 600; cursor: pointer; padding: 8px 10px; border-radius: 8px;
  }
  .textbtn:hover { background: rgba(128,128,128,.14); }
  .chip {
    display: inline-block; border: 1px solid var(--outline); border-radius: 8px;
    font-size: 11.5px; padding: 4px 9px; color: var(--sub); margin: 2px 4px 0 0;
  }
  .fchip {
    border: 1px solid var(--outline); background: transparent; color: var(--text);
    border-radius: 8px; font-size: 13px; padding: 7px 13px; cursor: pointer; flex: none;
  }
  .fchip.sel { background: var(--card2); border-color: var(--primary); color: var(--primary); font-weight: 600; }
  .badge { border: 1px solid var(--outline); border-radius: 8px; font-size: 11.5px; padding: 4px 9px; flex: none; }
  .badge.ready { color: var(--primary); }
  .badge.blocked { color: var(--error); }
  .field {
    width: 100%; background: var(--field); border: 1px solid var(--outline);
    border-radius: 4px 4px 0 0; border-bottom-width: 2px;
    color: var(--text); font-size: 14px; padding: 12px 12px 8px; outline: none;
  }
  .field:focus { border-bottom-color: var(--primary); }
  .field::placeholder { color: var(--sub); }
  .flabel { font-size: 11px; color: var(--sub); display: block; padding: 0 0 2px 2px; }
  .empty { padding: 32px 16px; color: var(--sub); font-size: 13.5px; }
  .chiprow { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; }
  .chiprow::-webkit-scrollbar { display: none; }
  .star { cursor: pointer; font-size: 18px; color: var(--outline); flex: none; padding: 4px; }
  .star.on { color: #f4c542; }
  /* ---------- bottom nav + gesture bar ---------- */
  .bottomnav {
    flex: none; height: 64px; background: var(--card); display: flex;
    border-top: 1px solid rgba(128,128,128,.12);
  }
  .bnav { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; color: var(--sub); font-size: 11px; }
  .bnav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .bnav .pill { padding: 3px 14px; border-radius: 14px; }
  .bnav.sel { color: var(--primary); }
  .bnav.sel .pill { background: var(--card2); }
  .gesturebar {
    flex: none; height: 26px; background: var(--card); display: flex;
    align-items: center; justify-content: space-around; padding: 0 70px;
  }
  .gesturebar .g { cursor: pointer; opacity: .7; }
  .gesturebar .g:hover { opacity: 1; }
  /* ---------- test result bar ---------- */
  .testbar { flex: none; background: var(--tonal); padding: 8px 16px 10px; }
  .testbar .rrow { display: flex; gap: 8px; align-items: center; }
  .testbar .rrow .spacer { flex: 0 0 auto; }
  /* ---------- overlays ---------- */
  #overlay { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.5); pointer-events: auto; }
  .dialog {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%);
    width: 82%; background: var(--card2); border-radius: 24px; padding: 22px;
    pointer-events: auto; box-shadow: 0 12px 40px rgba(0,0,0,.5); color: var(--text);
  }
  .dialog h3 { font-size: 17px; margin-bottom: 10px; font-weight: 600; }
  .dialog .dtext { font-size: 13.5px; line-height: 1.5; color: var(--text); }
  .dialog .dbtns { display: flex; justify-content: flex-end; gap: 4px; margin-top: 18px; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; background: var(--card2);
    border-radius: 24px 24px 0 0; padding: 20px 20px 28px; pointer-events: auto;
    color: var(--text); box-shadow: 0 -8px 32px rgba(0,0,0,.4);
    animation: rise .25s ease-out;
  }
  @keyframes rise { from { transform: translateY(40px); opacity: .4; } }
  .toast {
    position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: #333; color: #eee; font-size: 12.5px; padding: 9px 16px;
    border-radius: 8px; pointer-events: none; white-space: nowrap;
    animation: fade .25s; z-index: 40;
  }
  @keyframes fade { from { opacity: 0; transform: translateX(-50%) translateY(8px); } }
  .menu {
    position: absolute; top: 30px; right: 14px; background: var(--card2);
    border-radius: 12px; padding: 6px 0; min-width: 180px; pointer-events: auto;
    box-shadow: 0 8px 28px rgba(0,0,0,.5); color: var(--text);
  }
  .menu .mi { padding: 11px 16px; font-size: 13.5px; cursor: pointer; }
  .menu .mi:hover { background: rgba(128,128,128,.15); }
  /* ---------- test screens ---------- */
  .colorbox { position: absolute; inset: 0; cursor: pointer; }
  .colorcard {
    position: absolute; top: 14px; left: 14px; right: 14px;
    background: var(--card); border-radius: 12px; padding: 16px;
    box-shadow: 0 4px 18px rgba(0,0,0,.35);
  }
  .gridcanvas { position: absolute; inset: 0 0 0 0; touch-action: none; cursor: crosshair; }
  .tg-cell { position: absolute; }
  .mt-dot { position: absolute; border-radius: 50%; opacity: .8; pointer-events: none; transform: translate(-50%,-50%); }
  .camview {
    border-radius: 12px; flex: 1; margin: 0 16px; min-height: 280px;
    background: linear-gradient(135deg,#3a4a5a,#1c2733 40%,#2e3d2a 75%,#141b24);
    background-size: 300% 300%; animation: cam 9s ease-in-out infinite;
    display: flex; align-items: flex-end; padding: 12px; color: #cfd8e3; font-size: 12px;
  }
  @keyframes cam { 0%,100% { background-position: 0% 40%; } 50% { background-position: 100% 60%; } }
  .torch-on { box-shadow: 0 0 90px 30px rgba(255,240,140,.55) inset; }
  .sensorbar { height: 4px; background: var(--card2); border-radius: 2px; margin: 2px 0 6px; overflow: hidden; }
  .sensorbar > div { height: 100%; background: var(--primary); }
  /* ---------- insights ---------- */
  .statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--card2); border-radius: 10px; padding: 10px 12px; }
  .stat .n { font-size: 19px; font-weight: 700; }
  .stat .l { font-size: 11px; color: var(--sub); margin-top: 1px; }
  .donutwrap { position: relative; width: 104px; flex: none; }
  .donutwrap .dlabel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .hbar { height: 4px; background: var(--card2); border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .hbar > div { height: 100%; background: var(--error); }
  /* ---------- flow map ---------- */
  .flowmap {
    width: 330px; flex: none; border-left: 1px solid #262b34;
    overflow-y: auto; padding: 14px 14px 30px;
  }
  .flowmap h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: #8a93a5; margin: 16px 0 6px; }
  .flowmap h2:first-child { margin-top: 0; }
  .fnode {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: #151a20; border: 1px solid #232933; border-radius: 8px;
    padding: 7px 10px; margin-bottom: 5px; color: #c6cdd9; font-size: 12.5px;
  }
  .fnode:hover { border-color: #3d4b63; }
  .fnode.active { border-color: #a8c7fa; background: #1b2436; color: #d6e4ff; }
  .fnode .rt { display: block; font: 10.5px Consolas, monospace; color: #6b768c; margin-top: 2px; }
  .fnode.lvl1 { margin-left: 16px; }
  .fnode.lvl2 { margin-left: 32px; }
  .flegend { font-size: 11px; color: #6b768c; margin-top: 4px; }
  @media (max-width: 900px) { .flowmap { display: none; } .phone-col { min-width: 0; } }
  /* chat (settings/ai_chat) */
  .mono { font-family: Consolas, monospace; }
  .chatwrap { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .chatlog { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .chatform { flex: none; display: flex; gap: 8px; padding: 10px 16px;
    border-top: 1px solid rgba(128,128,128,.15); background: var(--surface); }
  #mpbox { position: absolute; width: 48px; height: 48px; background: var(--primary); }
</style>
</head>

<header class="page">
  <h1 style="display:flex;align-items:center;gap:10px">
    <svg viewBox="0 0 108 108" width="30" height="30"><defs><linearGradient id="dkg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3CE88A"/><stop offset="1" stop-color="#14B8CC"/></linearGradient></defs><path d="M47.07 80 L28.02 69 L28.02 39 L54 24 L79.98 39 L79.98 69 L60.93 80" fill="none" stroke="url(#dkg)" stroke-width="7" stroke-linejoin="round"/><path d="M49.5 44.5 Q49.5 40 54 40 Q58.5 40 58.5 44.5 L58.5 65.5 Q58.5 70 54 70 Q49.5 70 49.5 65.5 Z" fill="url(#dkg)"/></svg>

<div class="layout">
  <div class="phone-col">
    <div class="route-bar" id="routebar">route: home</div>
    <div class="phone" id="phone" data-theme="dark">
      <div class="statusbar"><span id="clock">9:41</span>

          <svg width="15" height="12" viewBox="0 0 16 12"><path d="M8 10.6 0 3.4 1.4 2 8 7.9 14.6 2 16 3.4z" fill="#ccc"/></svg>

        </span>
      </div>
      <div id="appbar"></div>
      <div class="progress-line" id="progline" style="display:none"><div id="progfill"></div></div>
      <div id="body"></div>
      <div id="testbar"></div>
      <nav class="bottomnav" id="bottomnav"></nav>
      <div class="gesturebar">
        <span class="g" id="gback" title="Back">◁</span>
        <span class="g" id="ghome" title="Home" style="font-size:11px">●</span>
        <span class="g" id="grecent" title="Recents" style="font-size:11px">■</span>
      </div>
      <div id="overlay"></div>
    </div>
  </div>
  <aside class="flowmap" id="flowmap"></aside>
</div>

<script>

/* DroidKit brand mark (Candidate 4, docs/branding/) */
const DK_MARK = `<svg viewBox="0 0 108 108" width="SIZE" height="SIZE" style="display:block"><defs><linearGradient id="dkg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3CE88A"/><stop offset="1" stop-color="#14B8CC"/></linearGradient></defs><path d="M47.07 80 L28.02 69 L28.02 39 L54 24 L79.98 39 L79.98 69 L60.93 80" fill="none" stroke="url(#dkg)" stroke-width="7" stroke-linejoin="round"/><path d="M49.5 44.5 Q49.5 40 54 40 Q58.5 40 58.5 44.5 L58.5 65.5 Q58.5 70 54 70 Q49.5 70 49.5 65.5 Z" fill="url(#dkg)"/></svg>`;

/* =====================================================================

function resolve(tool) {
  const reasons = [];
  if (tool.minSdk && DEVICE.sdkInt < tool.minSdk) reasons.push(`Requires Android API ${tool.minSdk}+`);
  tool.feats.forEach(f => { if (!DEVICE.features[f]) reasons.push(`Hardware missing: ${f}`); });
  tool.perms.forEach(p => { if (!S.perms[p]) reasons.push(`Permission required: ${p}`); });
  tool.caps.forEach(c => {
    if (c === "ELEVATED_SHELL") {
      if (!elevatedReady()) reasons.push("Needs elevated provider: Shizuku, root, or a connected wireless ADB session");
      return;
    }
    const kind = CAP2KIND[c], p = PROVIDERS[kind];
    if (!p || p.status !== "ready") {
      const d = !p ? "No provider registered"
        : p.status === "setup" ? `setup required — ${p.instructions}` : p.reason;
      reasons.push(`Needs ${kind} provider: ${d}`);
    }
  });
  return reasons.length ? { blocked: reasons } : { ready: true };
}

  if (tool.safety!==SAFE) chips.push(`<span class="chip">L${tool.safety}</span>`);
  if (tool.phase!=="V1") chips.push(`<span class="chip">${tool.phase}</span>`);
  return `<div class="card clickable" data-nav="${tool.route}" data-tool="${tool.id}" style="display:flex;align-items:center;gap:8px">
    <div class="grow">
      <div style="font-size:15px;font-weight:600">${esc(tool.title)}</div>
      <div class="t-mini sub" style="margin:2px 0 4px">${esc(tool.description)}</div>
      <div>${chips.join("")}</div>
    </div>
    <span class="badge ${r.ready?"ready":"blocked"}">${r.ready?"Ready":"Blocked"}</span>
    ${fav!==undefined?`<span class="star ${fav?"on":""}" data-fav="${tool.id}" title="Favorite">${fav?"★":"☆"}</span>`:""}
  </div>`;
}

      if(parts[1]==="gatt"){ body = scrGatt(decodeURIComponent(parts.slice(2).join("/"))); title="GATT explorer"; }

      break;

      if(parts[1]==="device"){ body=scrUsbDetail(decodeURIComponent(parts.slice(2).join("/"))); title="USB2.0 Flash Disk"; }

      break;
    case "nfc":
      if(parts[1]==="write"){ body=scrNfcWrite(); title="NFC Write"; }
      else { body=scrNfc(); title="NFC Lab"; }
      break;
    case "apps":
      if(parts[1]==="detail"){ body=scrAppDetail(parts.slice(2).join("/")); title="App detail"; }
      else { body=scrApps(); title="App Inspector"; }
      break;
    case "permissions": body = scrPermCenter(); title="Permission Center"; break;
    case "appops": body = scrAppOps(); title = S.appopsSel || "AppOps"; break;
    case "packages": body = scrPackages(); title="Package Controls"; break;

function startGuided(customer, device){

    preset:PRESETS[S.preset].label, customerLabel:customer||null, deviceLabel:device||null, notes:null, results:{} });

/* ---------- guided session ---------- */
function renderGuided(){
  if(!S.engine){ // direct navigation — arm with the Full diagnostic preset
    const id = "s-"+Date.now();
    S.sessions.unshift({ id, started:Date.now(), status:"IN_PROGRESS", version:DEVICE.appVersion,
      preset:PRESETS.FULL.label, notes:null, results:{} });
    S.engine = { sessionId:id, queue:presetTests("FULL"), index:0, results:{}, notes:{} };
  }
  const e = S.engine;
  if(e.index >= e.queue.length){ // done → review
    S.stack[S.stack.length-1] = "diagnose/review"; render(); return;
  }
  const test = e.queue[e.index];
  appbar(`Test ${e.index+1} of ${e.queue.length}: ${test.title}`);
  $("#progline").style.display="block";
  $("#progfill").style.width = (e.index/e.queue.length*100)+"%";
  renderBNav(); renderFlow();
  $("#routebar").textContent = "route: diagnose/guided";
  $("#body").innerHTML = testBody(test, "guided");
  if(!test.capKey){ $("#testbar").innerHTML = testResultBar(testUIState(test)); bindResultBar(test, "guided"); }
  bindTest(test, "guided");
}
function scrReview(){
  const e = S.engine;
  if(!e) return `<div class="pad empty">No active session — start a Full Diagnostic from the Diagnose tab first.</div>`;
  const counts = {};
  Object.values(e.results).forEach(st => counts[st]=(counts[st]||0)+1);
  const order = [["PASS","PASS"],["FAIL","FAIL"],["NOT_TESTED","SKIPPED"],["NOT_SUPPORTED","NOT SUPPORTED"],["PERMISSION_REQUIRED","PERMISSION"],["UNKNOWN","UNKNOWN"]];
  const summary = order.filter(([k])=>counts[k]).map(([k,l])=>`${l} ${counts[k]}`).join(" · ") || "No results recorded";
  const groups = {};
  Object.keys(e.results).forEach(tid => { const c = TEST(tid)?.cat||"Other"; (groups[c]=groups[c]||[]).push(tid); });
  const retryable = Object.entries(e.results).filter(([,st])=>st==="FAIL"||st==="NOT_TESTED").map(([k])=>k);
  return `<div class="pad col">
    <div class="card"><div class="t-small">${summary}</div></div>
    ${Object.entries(groups).map(([c,ids]) =>
      `<div class="sec-head">${c}</div>` + ids.map(tid => {
        const st = e.results[tid];
        const col = st==="PASS"?"pri":st==="FAIL"?"err":"sub";
        const note = e.notes[tid] ? `<div class="t-mini sub" style="margin-top:2px">${esc(e.notes[tid])}</div>` : "";
        return `<div class="card"><div class="row"><span class="grow t-med">${TEST(tid)?.title||tid}</span>
          <span class="t-mini ${col}" style="font-weight:700">${st.replace(/_/g," ")}</span></div>${note}</div>`;
      }).join("")).join("")}
    <input class="field" id="reviewNotes" placeholder="Technician notes" style="margin-top:8px">
    ${retryable.length?`<button class="btn-outline full" style="display:block;width:100%" data-act="retry-tests">Retry ${retryable.length} failed/skipped test(s)</button>`:""}
    <button class="btn full" data-act="save-session">Save session</button>
  </div>`;
}

function bindResultBar(test, mode){

function bindTest(test, mode){
  const body = $("#body");
  if(test.id.startsWith("display.")){
    const colors=["#ff0000","#00ff00","#0000ff","#ffffff","#000000"];
    const names=["Red","Green","Blue","White","Black"];
    let i=0, hidden=false;
    const box=$("#colorbox"), card=$("#colorcard"), label=$("#colorlabel");
    card.addEventListener("click",e=>e.stopPropagation());
    $("#colorwrap").addEventListener("click",()=>{
      if(!hidden){hidden=true;card.style.display="none";}
      else if(i<colors.length-1){i++;box.style.background=colors[i];label.textContent=`Showing ${names[i]} (${i+1}/5) — ${test.id==="display.dead_pixel"?"inspect every pixel before tapping":"tap to switch color"}`;}
      else {hidden=false;card.style.display="block";}
    });
  }
  if(test.id==="touch.grid"){
    const wrap=$("#tgcanvas"), label=$("#tglabel"), pass=$("#passbtn");
    const covered=new Set(); let down=false;
    const rect=()=>wrap.getBoundingClientRect();
    function mark(e){ const r=rect();
      const col=Math.min(7,Math.floor((e.clientX-r.left)/(r.width/8)));
      const row=Math.min(11,Math.floor((e.clientY-r.top)/(r.height/12)));
      if(col<0||row<0)return;
      const cell=row*8+col;
      if(covered.has(cell))return;
      covered.add(cell);
      const d=document.createElement("div"); d.className="tg-cell";
      d.style.cssText=`left:${col/8*100}%;top:${row/12*100}%;width:${100/8}%;height:${100/12}%;background:rgba(76,175,80,.4)`;
      wrap.appendChild(d);
      label.textContent=`Touch grid — ${covered.size}/96 cells covered`;
      if(covered.size/96>=0.9) pass.disabled=false;
    }
    // draw grid lines
    let lines="";
    for(let c=1;c<8;c++) lines+=`<div class="tg-cell" style="left:${c/8*100}%;top:0;width:1px;height:100%;background:rgba(128,128,128,.5)"></div>`;
    for(let rr=1;rr<12;rr++) lines+=`<div class="tg-cell" style="top:${rr/12*100}%;left:0;height:1px;width:100%;background:rgba(128,128,128,.5)"></div>`;
    wrap.innerHTML=lines;
    wrap.addEventListener("pointerdown",e=>{down=true;wrap.setPointerCapture(e.pointerId);mark(e);});
    wrap.addEventListener("pointermove",e=>{if(down)mark(e);});
    wrap.addEventListener("pointerup",()=>down=false);
    // stash coverage for the note
    S.tgCoverage = () => `Coverage ${covered.size}/96 (${Math.round(covered.size/96*100)}%)`;
  }
  if(test.id==="touch.multitouch"){
    const wrap=$("#mtwrap"), label=$("#mtlabel");
    const colors=["#E91E63","#3F51B5","#009688","#FF9800","#9C27B0","#4CAF50","#FFC107","#00BCD4","#795548","#607D8B"];
    const active=new Map(); let max=0;
    function draw(){
      wrap.querySelectorAll(".mt-dot").forEach(d=>d.remove());
      active.forEach((p,id)=>{
        const c=colors[id%colors.length];
        const d=document.createElement("div"); d.className="mt-dot";
        d.style.cssText=`left:${p.x}px;top:${p.y}px;width:90px;height:90px;background:${c}59;border:3px solid ${c}`;
        wrap.appendChild(d);
      });
      label.textContent=`Multitouch — active: ${active.size}, max seen: ${max}`;
    }
    function pos(e){ const r=wrap.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
    wrap.addEventListener("pointerdown",e=>{ active.set(e.pointerId,pos(e)); if(active.size>max)max=active.size; draw(); });
    wrap.addEventListener("pointermove",e=>{ if(active.has(e.pointerId)){active.set(e.pointerId,pos(e));draw();} });
    const up=e=>{active.delete(e.pointerId);draw();};
    wrap.addEventListener("pointerup",up); wrap.addEventListener("pointercancel",up);
    S.mtMax = () => `Max simultaneous pointers: ${max}`;
  }
  if(test.sensor!==undefined){
    const s=SENSORS.find(x=>x.type===test.sensor);
    const el=$("#sread");
    let n=0;
    every(()=>{ n++;
      el.innerHTML = s.axes.map(ax=>{
        const base={x:0.4,y:9.4,z:0.8,value:s.type===5?Math.abs(Math.sin(n/6))*400+40:s.type===8?(n%20<10?0:5):1013.2,w:0.5}[ax]??0;
        const v = base + Math.sin(n/4 + ax.charCodeAt(0))* (ax==="value"&&s.type===5?30:0.25);
        return `<div class="row"><span class="grow t-body">${ax}</span><span class="t-body">${v.toFixed(3)} ${s.unit}</span></div>`;
      }).join("");
    },300);
  }
  if(test.capKey){
    const r=capReading(test.capKey);
    later(()=>emitResult(test, r.supported?"PASS":"NOT_SUPPORTED", r.supported?`${r.label}: ${r.value}`:r.label),1100);
  }
}
function emitResult(test, state){
  const note = $("#tnote")?.value?.trim() || null;
  let full = note;
  if(test.id==="touch.grid" && S.tgCoverage) full=[note,S.tgCoverage()].filter(Boolean).join("; ");
  if(test.id==="touch.multitouch" && S.mtMax) full=[note,S.mtMax()].filter(Boolean).join("; ");
  if(S.engine && S.stack.includes("diagnose/guided") || cur()==="diagnose/guided"){
    const e=S.engine;
    e.results[test.id]=state; if(full)e.notes[test.id]=full;
    const sess=S.sessions.find(x=>x.id===e.sessionId);
    if(sess){ sess.results[test.id]={state,note:full}; }
    e.index++;
    if(e.index>=e.queue.length){ replace("diagnose/review"); } else render();
  } else {
    goBack();
  }
}

function sessStats(s){
  const c={PASS:0,FAIL:0,SKIP:0,total:0};
  Object.values(s.results).forEach(r=>{ c.total++;
    if(r.state==="PASS")c.PASS++; else if(r.state==="FAIL")c.FAIL++; else c.SKIP++; });
  c.rate=c.total?c.PASS/c.total:0; return c;
}
function insightSessions(){
  const cutoff = S.insightRange==="30d" ? Date.now()-30*86400000 : 0;
  return S.sessions.filter(x=>x.status==="COMPLETED"&&x.started>=cutoff)
    .sort((a,b)=>a.started-b.started);
}
function donutSvg(st){
  const size=104, rr=43, C=2*Math.PI*rr, tot=st.total||1; let off=0;
  const seg=(frac,color)=>{ if(frac<=0)return""; const len=frac*C;
    const el=`<circle cx="52" cy="52" r="${rr}" fill="none" stroke="${color}" stroke-width="15" stroke-dasharray="${len.toFixed(1)} ${(C-len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"/>`;
    off+=len; return el; };
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="52" cy="52" r="${rr}" fill="none" stroke="var(--card2)" stroke-width="15"/>
    ${seg(st.PASS/tot,"var(--primary)")}${seg(st.FAIL/tot,"var(--error)")}${seg(st.SKIP/tot,"var(--outline)")}</svg>`;
}
function barsSvg(points){
  const w=340,h=104,n=points.length,gap=(w-20)/n,bw=Math.min(36,gap-10),base=h-22;
  const bars=points.map((p,i)=>{
    const bh=Math.max(3,Math.round(p.rate*(base-10)));
    const x=10+i*gap+(gap-bw)/2, y=base-bh;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${p.fail?"var(--error)":"var(--primary)"}"><title>${esc(p.title)}</title></rect>
      <text x="${x+bw/2}" y="${h-6}" text-anchor="middle" font-size="9.5" fill="var(--sub)">${esc(p.label)}</text>`;
  }).join("");
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}">
    <line x1="10" y1="${base}" x2="${w-10}" y2="${base}" stroke="var(--outline)" stroke-width="1" opacity=".5"/>${bars}</svg>`;
}
function sparkSvg(vals){
  const w=300,h=44,min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||1;
  const pts=vals.map((v,i)=>`${(10+i*(w-20)/(vals.length-1)).toFixed(1)},${(8+(1-(v-min)/span)*(h-18)).toFixed(1)}`).join(" ");
  const [lx,ly]=pts.split(" ").pop().split(",");
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lx}" cy="${ly}" r="3.5" fill="var(--primary)"/></svg>`;
}
function testAttention(list){
  const agg={};
  list.forEach(s=>Object.entries(s.results).forEach(([tid,r])=>{
    const a=agg[tid]||(agg[tid]={fails:0,skips:0});
    if(r.state==="FAIL")a.fails++; else if(r.state!=="PASS")a.skips++;
  }));
  return Object.entries(agg).filter(([,a])=>a.fails||a.skips)
    .sort((x,y)=>(y[1].fails*2+y[1].skips)-(x[1].fails*2+x[1].skips)).slice(0,4);
}

function scrStorage(){

  return `<div class="pad col">

function scrLiveSensor(type){
  const s=SENSORS.find(x=>x.type===type);
  if(!s||!s.live) return `<div class="empty">This sensor type is not in the live-monitor safe list.</div>`;
  later(()=>{ // start fake stream after mount
    let n=0;
    every(()=>{ n++;
      s.axes.forEach((ax,i)=>{
        const v={x:0.4+Math.sin(n/5)*1.2,y:9.4+Math.cos(n/6)*.8,z:0.8+Math.sin(n/4)*.4,
          value:s.type===5?Math.abs(Math.sin(n/7))*500+60:s.type===8?(n%16<8?0:5):s.type===6?1013+Math.sin(n/9)*2:0.5,w:0.5+Math.sin(n/8)*.1}[ax]??0;
        const cell=$("#lv"+i); if(cell) cell.textContent=v.toFixed(3)+" "+s.unit;
        const bar=$("#lb"+i); if(bar) bar.style.width=Math.min(100,Math.abs(v)/s.range*100)+"%";
      });
      const u=$("#lvupdates"); if(u)u.textContent=n;
    },250);
  },50);
  const rec = S.sensorRec;
  return `<div class="pad col">
    ${sectionCard("Live values", s.axes.map((ax,i)=>`
      <div class="inforow"><span class="k">${ax}</span><span class="v" id="lv${i}">—</span></div>
      <div class="sensorbar"><div id="lb${i}" style="width:0%"></div></div>`).join("")+
      `<div class="inforow"><span class="k">Updates</span><span class="v" id="lvupdates">0</span></div>`)}
    ${sectionCard("Sensor", infoRow("Vendor",s.vendor)+infoRow("Type",s.stype,false)+infoRow("Max range",(s.range+" "+s.unit).trim(),false)+infoRow("Resolution",s.res,false))}
    ${sectionCard("Session recording", `
      <div class="t-body" id="recState">${rec.recording?`Recording… ${rec.samples} samples (cap 2000)`:"Record a short live session, then share it as CSV."}</div>
      <div class="row" style="margin-top:8px">
        <button class="btn-outline" data-act="sensor-rec">${rec.recording?"Stop":"Record"}</button>
        ${!rec.recording&&rec.samples?`<button class="btn-outline" data-act="sensor-share">Share ${rec.samples} samples as CSV</button>`:""}
      </div>`)}
  </div>`;
}

/* ---------- compare sessions ---------- */
function scrCompare(){
  const done=S.sessions.filter(s=>s.status==="COMPLETED");
  const c=S.cmp;
  if(done.length<2) return `<div class="pad empty">Run at least two diagnostic sessions to compare before/after.</div>`;
  const pick=(which)=>`<div class="chiprow">${done.map(s=>
    `<button class="fchip ${c[which]===s.id?"sel":""}" data-cmp="${which}:${s.id}">${fmtDT(s.started)}${s.deviceLabel||s.customerLabel?" · "+esc(s.deviceLabel||s.customerLabel):""}</button>`).join("")}</div>`;
  let result="";
  if(c.done&&c.before&&c.after){
    const b=done.find(s=>s.id===c.before), a=done.find(s=>s.id===c.after);
    const bres=b?.results||{}, ares=a?.results||{};
    const rows=[]; let unchanged=0;
    [...new Set([...Object.keys(bres),...Object.keys(ares)])].forEach(tid=>{
      const bs=bres[tid]?.state||null, as=ares[tid]?.state||null;
      if(bs===as){unchanged++;return;}
      let tr="CHANGED";
      if(as==="PASS"&&bs==="FAIL")tr="FIXED";
      else if(as==="PASS")tr="IMPROVED";
      else if(bs==="PASS")tr="REGRESSED";
      else if(!bs)tr="ADDED"; else if(!as)tr="REMOVED";
      rows.push({tid,tr,bs,as});
    });
    result=`<div class="sec-head">Test transitions</div>
      ${rows.length?rows.map(r=>`<div class="card"><div class="row">
        <span class="t-small ${r.tr==="REGRESSED"?"err":(r.tr==="FIXED"||r.tr==="IMPROVED")?"pri":"sub"}" style="font-weight:700;width:86px">${r.tr}</span>
        <div class="grow"><div class="t-med">${r.tid}</div><div class="t-mini sub">${r.bs||"—"} → ${r.as||"—"}</div></div></div></div>`).join("")
        :`<div class="t-body">No state changes between sessions.</div>`}
      ${unchanged?`<div class="t-mini sub">${unchanged} tests unchanged.</div>`:""}
      <div class="sec-head">Device changes</div>
      <div class="card"><div class="t-small">Free storage</div><div class="t-mini sub">68.2 GB → ${fmtBytes(DEVICE.storageFree)}</div></div>`;
  }
  return `<div class="pad col">
    <div class="sec-head">Before</div>${pick("before")}
    <div class="sec-head">After</div>${pick("after")}
    <button class="btn full" data-act="cmp-run" ${c.before&&c.after&&c.before!==c.after?"":"disabled"}>Compare</button>
    ${result}
  </div>`;
}

  const bd = e.target.closest("[data-bledev]"); if(bd){

    else toast("BLUETOOTH_CONNECT required to inspect services"); return; }
  const gr = e.target.closest("[data-gattread]"); if(gr){ const g=S.ble.gatt[gr.dataset.addr];
    if(g){ const [si,ci]=gr.dataset.gattread.split(":").map(Number); const c=g.services[si].chars[ci];
      c.val="0x"+Array.from({length:4},()=>Math.floor(Math.random()*255).toString(16).padStart(2,"0")).join(" ");
      render(); } return; }
  const ss = e.target.closest("[data-snapsel]"); if(ss){ const id=+ss.dataset.snapsel;
    if(S.snapSel.before==null) S.snapSel.before=id;
    else if(S.snapSel.after==null&&id!==S.snapSel.before) S.snapSel.after=id;
    else { S.snapSel.before=id; S.snapSel.after=null; }

  const ao = e.target.closest("[data-appop]"); if(ao){ const [op,m]=ao.dataset.appop.split(":");
    const conseq={allow:"lets the app use it normally.",ignore:"makes the operation silently fail — the app sees no error, it just gets nothing.",deny:"denies the operation — the app may crash or show a permission error.",default:"restores Android's default decision for this op."};
    dialog({title:`Set ${op}?`,text:`This changes how Android treats ${S.appopsSel} for the “${op}” operation. Setting ${op} to ${m} ${conseq[m]} The change applies immediately and persists until you change it back.`,
      confirm:"Set to "+m,cancel:"Cancel",onConfirm:"appop:"+op+":"+m}); return; }
  const pa = e.target.closest("[data-pkgact]"); if(pa){ const [act2,pkg]=pa.dataset.pkgact.split(":");
    if(act2==="perms"){ pkgPermSheet(pkg); return; }

    dialog({title:msgs[act2][0],text:msgs[act2][1],confirm:"Confirm",cancel:"Cancel",danger:true,onConfirm:"pkg:"+act2+":"+pkg}); return; }
  const pr = e.target.closest("[data-preset]"); if(pr){ S.preset=pr.dataset.preset; render(); return; }
  const ir = e.target.closest("[data-irange]"); if(ir){ S.insightRange=ir.dataset.irange; render(); return; }
  const cm = e.target.closest("[data-cmp]"); if(cm){ const [w,id]=cm.dataset.cmp.split(":"); S.cmp[w]=id; S.cmp.done=false; render(); return; }

  const ac = e.target.closest("[data-act]");
  if(ac){ handleAct(ac.dataset.act, ac, e); return; }

function handleAct(act, el, e){
  switch(act){
    case "dlg-close": closeOverlay(); break;
    case "dlg-ok": { const cb=$("#overlay").dataset.dlgOk||""; closeOverlay(); dlgOk(cb); break; }
    case "start-diag": intakeSheet(); break;
    case "intake-skip": closeOverlay(); startGuided(null,null); break;
    case "intake-start": { const c=$("#intakeCust")?.value.trim(), d=$("#intakeDev")?.value.trim();
      closeOverlay(); startGuided(c||null,d||null); break; }
    case "save-tech": S.technician=($("#techName")?.value||"").trim(); toast("Technician saved"); break;
    case "grant-provider": nav("adb"); break;
    case "pkg-grant": toast("No Shizuku/root provider on this mock device — pair wireless ADB instead"); break;
    case "clear-elevlog": S.elevLog=[]; render(); break;
    case "ai-toggle": S.ai.enabled=!S.ai.enabled; render(); break;
    case "ai-savekey": { const v=$("#aiKey")?.value.trim();
      if(v){ S.ai.hasKey=true; S.ai.status=null; render(); toast("Key stored (AES/GCM, AndroidKeyStore)"); } break; }
    case "ai-disconnect": S.ai.hasKey=false; S.ai.turns=[]; S.ai.status=null; render(); toast("Key removed"); break;
    case "ai-test": S.ai.testing=true; render();
      later(()=>{ S.ai.testing=false; S.ai.status=S.ai.hasKey?"Connected":"No API key stored";
        if(cur()==="settings")render(); },1200); break;
    case "ai-send": { const v=$("#aiInput")?.value.trim(); if(!v)break;
      S.ai.turns.push({role:"user",text:v}); S.ai.busy=true; render();
      later(()=>{ S.ai.busy=false;
        S.ai.turns.push({role:"assistant",
          text:"Battery is at 72%, discharging at ~412 mA with a healthy 31.4 °C. Nothing abnormal — the drain is consistent with screen-on use.\n\nI can open a relevant tool if you want to dig deeper.",
          proposals:[
            {label:"Open battery.lab",allowed:true,action:"nav:battery"},

    case "ai-summary": { const t=$("#aiSummaryText"); if(!t)break;

      if(!S.ai.hasKey){ t.textContent="No API key stored — add one in Settings."; t.className="t-mini err"; break; }
      t.textContent="Summarizing…";
      later(()=>{ const tt=$("#aiSummaryText"); if(tt){
        tt.textContent="21 checks ran: 18 passed. Touch grid failed (74/96 cells, dead zone top-left) — consistent with a digitizer fault or damaged panel region. Proximity sensor absent (NOT_SUPPORTED). Recommend panel replacement, then re-run Full diagnostic and use Compare sessions to verify the fix.";
        tt.className="t-body"; } },1300); break; }

    case "ble-scan": { const b=S.ble;
      if(b.scanning) b.scanning=false;
      else { b.scanning=true; b.results=[];
        later(()=>{ b.scanning=false; b.results=[
          {name:"Pixel Buds Pro 2",addr:"C4:77:64:3A:11:9B",rssi:-48},
          {name:"BLE Beacon",addr:"F0:18:98:0C:D2:71",rssi:-71},

      if(v){ pushElevLog("pm install-existing "+v); toast("Restored "+v+" (mock)"); S.pkgRestore=""; render(); } break; }
    case "adb-tls": S.adb.useTls=!S.adb.useTls; break;
    case "adb-pair": { const a=S.adb;
      a.pairHost=$("#adbPairHost")?.value||a.pairHost;
      a.pairPort=$("#adbPairPort")?.value||""; a.pairCode=$("#adbPairCode")?.value||"";
      if(!a.pairPort||!a.pairCode){ toast("Enter pairing port and code"); break; }
      a.busy=true; render();
      later(()=>{ a.busy=false; a.paired=true; if(cur()==="adb")render(); toast("Paired — identity saved"); },900); break; }
    case "adb-connect": { const a=S.adb;
      a.connHost=$("#adbConnHost")?.value||""; a.connPort=$("#adbConnPort")?.value||"";
      if(!a.paired){ toast("Pair first — no stored identity"); break; }
      if(!a.connPort){ toast("Enter connect port"); break; }
      a.busy=true; render();
      later(()=>{ a.busy=false; a.session=`${a.connHost||a.pairHost}:${a.connPort}${a.useTls?" (TLS)":""}`;
        PROVIDERS.ADB={status:"ready"};
        if(cur()==="adb")render(); toast("ADB session established — elevated tools unlocked"); },1300); break; }
    case "adb-disconnect": S.adb.session=null;
      PROVIDERS.ADB={status:"setup",instructions:"enable wireless debugging in Developer options, then pair"};
      render(); toast("Disconnected"); break;
    case "adb-props": S.adb.props=[["ro.product.model","Pixel 8 Pro"],["ro.build.version.release","15"],
      ["ro.build.version.sdk","35"],["ro.serialno","3A181JEHN08842"],
      ["ro.build.fingerprint","google/husky/husky:15/AP4A.250905.014/14070145:user/release-keys"]];
      pushElevLog("getprop"); render(); break;
    case "adb-log": { const n=$("#adbLogLines")?.value||"200"; S.adb.logLines=n;
      S.adb.log=["09:41:12.331  I  ActivityManager: Start proc io.github.droidkit",
        "09:41:12.874  D  OpenGLRenderer: Skia GL pipeline",
        "09:41:13.012  I  DroidKit: capability resolve — ADB ready",
        "09:41:13.204  W  InputReader: device associated",
        "09:41:14.556  I  ThermalEngine: sensor=skin_therm temp=31.4"].join("<br>");
      pushElevLog("logcat -d -t "+n); render(); break; }
    case "adb-reboot": dialog({title:"Reboot this device?",
      text:"The device will power off and restart immediately. Unsaved work in other apps is lost.",
      confirm:"Reboot",cancel:"Cancel",danger:true,onConfirm:"adb-reboot"}); break;
    case "cmp-run": S.cmp.done=true; render(); break;
    case "req-perm": sysPermDialog(el.dataset.perm, true); break;
    case "note-toggle": {
      const tb=$("#testbar");
      tb.insertAdjacentHTML("afterbegin",`<input class="field" id="tnote" placeholder="Note (optional)" style="margin-bottom:8px">`);
      $("#tnote").focus(); break; }
    case "vibrate": navigator.vibrate?.(400); tone(180,.12,.08); toast("Buzz (simulated on desktop)"); break;
    case "playtone": { tone(440,1); const c=$("#playcount"); c.dataset.n=(+c.dataset.n||0)+1; c.textContent=`Played ${c.dataset.n} time(s)`; break; }
    case "mic-rec": { const b=$("#micrec"),st=$("#micstate");
      if(b.dataset.rec){ b.dataset.rec="";b.textContent="Record 3s+";st.textContent="Recording saved (3.0 s)";$("#micplay").disabled=false; }
      else { b.dataset.rec="1";b.textContent="Stop";st.textContent="Recording…"; 
        later(()=>{ if($("#micrec")?.dataset.rec){$("#micrec").dataset.rec="";$("#micrec").textContent="Record 3s+";$("#micstate").textContent="Recording saved (3.0 s)";$("#micplay").disabled=false;} },3000); }
      break; }
    case "mic-play": tone(330,.5); later(()=>tone(392,.5),400); toast("Playing back recording"); break;
    case "torch": { const b=$("#torchbtn"),on=b.dataset.on==="1";b.dataset.on=on?"":"1";
      b.textContent=on?"Turn torch ON":"Turn torch OFF";
      $("#torchstate").textContent=on?"":"Torch is ON — check the LED on the back.";
      $(".camview, .phone").classList?.toggle?.("torch-on",!on); break; }
    case "charge-refresh": $("#chargeread").innerHTML=chargeReading(); toast("Reading refreshed"); break;
    case "netdiag": $("#netdiag").innerHTML=`<div class="t-body">Running…</div>`;
      later(()=>{ if($("#netdiag"))$("#netdiag").innerHTML=netLayers(); },800); break;
    case "ping": { const h=$("#pinghost").value.trim(); if(!h)break;
      $("#pingout").innerHTML=`<div class="t-body">Probing…</div>`;
      later(()=>{ if($("#pingout"))$("#pingout").innerHTML=
        infoRow("Resolved","142.250.72.14")+infoRow("Replies","4/4 (0% loss)",false)+
        infoRow("Min / Avg / Max","11.8 ms / 14.2 ms / 19.5 ms",false)+
        `<div class="t-mini sub">ICMP echo is often filtered — no reply does not prove the host is down.</div>`; },900); break; }
    case "dns": { const h=$("#dnshost").value.trim(); if(!h)break;
      $("#dnsout").innerHTML=`<div class="t-body">Resolving…</div>`;
      later(()=>{ if($("#dnsout"))$("#dnsout").innerHTML=
        infoRow("Address","142.250.72.14")+infoRow("Address","2607:f8b0:4006:80e::200e")+infoRow("Elapsed","18 ms",false); },600); break; }
    case "bt-enable": dialog({title:"Enable Bluetooth?",text:"An app wants to turn Bluetooth on.",confirm:"Allow",cancel:"Deny",onConfirm:"bt-on"}); break;
    case "nfc-scan": { const n=S.nfc;
      if(n.scanning||n.armed){ n.scanning=false;n.armed=null; }
      else { n.scanning=true; n.result=null;
        later(()=>{ if(S.nfc.scanning){ S.nfc.tag={...NFC_TAG}; S.nfc.scanning=false; if(cur()==="nfc")render(); } },1600); }
      render(); break; }
    case "nfc-erase": dialog({title:"Erase tag?",text:"This writes an empty NDEF message to the next presented tag, removing its current content. Present the tag after confirming.",confirm:"Erase next tag",cancel:"Cancel",onConfirm:"nfc-arm-erase"}); break;
    case "nfc-disarm": S.nfc.armed=null; render(); break;
    case "nfc-write": { const size=(S.nfcInput||"").length+7;
      dialog({title:"Write to tag?",text:`This writes a ${size}-byte NDEF message to the next presented tag, replacing its current content. The tag must be writable and have enough capacity.`,confirm:"Arm write",cancel:"Cancel",onConfirm:"nfc-arm-write"}); break; }
    case "usb-perm": S.usbPermPending[el.dataset.dev]=true; render();
      later(()=>{ S.usbPermPending={}; S.usbPerm[el.dataset.dev]=true; if(cur().startsWith("usb/"))render(); },1200); break;
    case "copy-usb": navigator.clipboard?.writeText("USB2.0 Flash Disk 090C:1000 Mass Storage").catch(()=>{}); toast("USB summary copied"); break;
    case "share-usb": toast("Sharesheet would open (mock)"); break;
    case "copy-section": navigator.clipboard?.writeText("["+el.dataset.sec+"]").catch(()=>{}); toast("Section copied"); break;
    case "share-device": toast("Sharesheet would open (mock)"); break;
    case "launch-app": toast(`Would launch ${el.dataset.app} (mock)`); break;
    case "app-settings": toast(`Would open system settings for ${el.dataset.app}`); break;
    case "intent": toast(`Would launch intent ${el.dataset.intent}`); break;
    case "custom-intent": toast("Would launch custom intent"); break;
    case "reports-menu": {
      const ov=$("#overlay");
      ov.innerHTML=`<div class="scrim" data-act="dlg-close"></div>
        <div class="menu"><div class="mi" data-act="del-all">Delete all reports</div></div>`; break; }
    case "del-all": dialog({title:"Delete all reports?",text:"Every diagnostic session, result and saved report entry is deleted permanently.",confirm:"Delete all",cancel:"Cancel",danger:true,onConfirm:"del-all"}); break;
    case "copy-summary": navigator.clipboard?.writeText("DroidKit report summary").catch(()=>{}); toast("Summary copied"); break;
    case "export": { const ov=$("#overlay"); let fmt="TEXT";
      ov.innerHTML=`<div class="scrim" data-act="dlg-close"></div>
        <div class="sheet"><div class="t-med" style="font-weight:600">Export preview</div>
          <div class="t-mini" style="margin:6px 0 8px">This report contains:</div>
          <div class="t-mini">• Session ID, date and app version</div>
          <div class="t-mini">• Device manufacturer, model, Android release, security patch</div>
          <div class="t-mini">• RAM, storage, display and provider capability summary</div>
          <div class="t-mini">• Every test result, state and technician note</div>
          <div class="chiprow" style="margin-top:12px">
            <button class="fchip sel" data-fmt="TEXT">Text (.txt)</button>
            <button class="fchip" data-fmt="PDF">PDF (.pdf)</button>
            <button class="fchip" data-fmt="CERT">Certificate (.pdf)</button></div>
          <button class="btn full" style="margin-top:14px" data-act="share-report">Share <span id="fmtLbl">TEXT</span> report</button>
        </div>`; break; }
    case "share-report": closeOverlay(); toast("Report exported & sharesheet opened (mock)"); break;
    case "delete-report": { const id=cur().split("/").pop(); const s=S.sessions.find(x=>x.id===id);
      dialog({title:"Delete report?",text:`This session and its ${s?Object.keys(s.results).length:0} results are deleted permanently.`,confirm:"Delete",cancel:"Cancel",danger:true,onConfirm:"del-report:"+id}); break; }
    case "retry-tests": { const e=S.engine;
      const retryable=Object.entries(e.results).filter(([,st])=>st==="FAIL"||st==="NOT_TESTED").map(([k])=>k);
      e.queue=TESTS.filter(x=>retryable.includes(x.id)); e.index=0;
      replace("diagnose/guided"); break; }
    case "save-session": { const e=S.engine;
      const sess=S.sessions.find(x=>x.id===e.sessionId);
      if(sess){ sess.status="COMPLETED"; sess.notes=$("#reviewNotes")?.value?.trim()||null; }
      S.engine=null; S.tab="diagnose"; S.stack=["diagnose"]; closeOverlay(); render(); toast("Session saved"); break; }
  }
}
function dlgOk(cb){
  if(!cb)return;
  if(cb.startsWith("grant:")){ const p=cb.slice(6); S.perms[p]=true; render(); return; }
  switch(true){
    case cb==="bt-on": S.btEnabled=true; render(); break;
    case cb==="del-all": S.sessions=[]; S.engine=null; render(); break;
    case cb.startsWith("del-report:"): { const id=cb.split(":")[1];
      S.sessions=S.sessions.filter(x=>x.id!==id); goBack(); break; }
    case cb==="nfc-arm-erase": S.nfc.armed="erase"; S.nfc.tag=null;
      later(()=>{ if(S.nfc.armed){S.nfc.armed=null;S.nfc.result="Tag erased — empty NDEF message written.";if(cur().startsWith("nfc"))render();} },2200); render(); break;
    case cb==="nfc-arm-write": S.nfc.armed="write";
      later(()=>{ if(S.nfc.armed){S.nfc.armed=null;S.nfc.result="NDEF message written successfully.";if(cur().startsWith("nfc"))render();} },2200); render(); break;
    case cb==="adb-reboot": toast("Rebooting (mock)"); break;
    case cb.startsWith("appop:"): { const [,op,m]=cb.split(":");
      const o=appopsFor(S.appopsSel).find(x=>x.op===op); if(o)o.mode=m;
      pushElevLog(`appops set ${S.appopsSel} ${op} ${m}`); render(); break; }
    case cb.startsWith("pkg:"): { const [,act2,pkg]=cb.split(":");
      pushElevLog(`pm ${act2==="disable"?"disable-user":act2==="clear"?"clear":"uninstall --user 0"} ${pkg}`);
      toast(`${act2} ${pkg} — done (mock)`); break; }
  }
}
function pushElevLog(command, exit=0){
  const t=new Date().toLocaleTimeString("en-US",{hour12:false});
  S.elevLog.unshift({time:t,provider:(elevatedProvider()||"adb").toLowerCase(),exit,command});
}
function runProposal(i){
  const t=S.ai.turns[i]; if(!t||!t.proposals)return;
  const p=t.proposals.find(x=>x.allowed); if(!p)return;
  if(p.action.startsWith("nav:")){ nav(p.action.slice(4)); return; }
  if(p.action.startsWith("elev:")){ const cmd=p.action.slice(5);
    pushElevLog(cmd);
    S.ai.turns.push({role:"assistant",text:"```\n"+cmd+" → exit 0 (mock output)\n```"});
    render(); }
}
/* inputs (delegated, no re-render to preserve focus) */
document.addEventListener("input", e=>{
  if(e.target.id==="toolSearch"){ S.toolsQuery=e.target.value; renderToolList(); }
  if(e.target.id==="appSearch"){ S.appsQuery=e.target.value; renderAppList(); }
  if(e.target.id==="nfcinput"){ S.nfcInput=e.target.value;
    const b=$("#body [data-act='nfc-write']"); if(b) b.disabled=!e.target.value.trim(); }
  if(e.target.id==="ci-action"||e.target.id==="ci-data"||e.target.id==="ci-pkg"){
    const a=$("#ci-action").value.trim(),d=$("#ci-data").value.trim(),p=$("#ci-pkg").value.trim();
    $("#ci-preview").textContent=`Intent(action=${a||"…"}${d?", data="+d:""}${p?", package="+p:""})`;
    $("#ci-launch").disabled=!a; }
  if(e.target.id==="appopsQuery"){ S.appopsQuery=e.target.value; const l=$("#appopsList"); if(l)l.innerHTML=appopsListHtml(); }
  if(e.target.id==="pkgQuery"){ S.pkgQuery=e.target.value; const l=$("#pkgList"); if(l)l.innerHTML=pkgListHtml(); }
  if(e.target.id==="pkgRestore"){ S.pkgRestore=e.target.value;
    const b=$("#body [data-act='pkg-restore']"); if(b)b.disabled=!e.target.value.trim(); }
  if(e.target.id==="dl-uri"){ const b=$("#dl-go"); if(b)b.disabled=!e.target.value.trim(); }
});
document.addEventListener("click", e=>{
  const fc=e.target.closest("[data-fmt]");
  if(fc){ document.querySelectorAll("[data-fmt]").forEach(x=>x.classList.remove("sel"));
    fc.classList.add("sel"); $("#fmtLbl").textContent=fc.dataset.fmt; }
  const nk=e.target.closest("[data-nfckind]");
  if(nk){ S.nfcKind=nk.dataset.nfckind; render(); }
  const th=e.target.closest("[data-theme-opt]");
  if(th){ S.theme=th.dataset.themeOpt==="LIGHT"?"light":th.dataset.themeOpt==="SYSTEM"?"dark":"dark";
    $("#phone").dataset.theme=S.theme; }
  const am=e.target.closest("[data-aimodel]");
  if(am){ S.ai.model=am.dataset.aimodel; }
});
/* gesture bar */
$("#gback").addEventListener("click",goBack);
$("#ghome").addEventListener("click",()=>goTab("home"));
$("#grecent").addEventListener("click",()=>toast("Recents (mock)"));
/* clock */
setInterval(()=>{ const d=new Date(); $("#clock").textContent=`${d.getHours()%12||12}:${String(d.getMinutes()).padStart(2,"0")}`; },1000);
render();
</script>
